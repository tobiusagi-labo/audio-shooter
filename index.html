        ・外側から音が聞こえたらその方向へ移動<br>
        ・<b>【正面】</b>に合致した瞬間に <b>撃つ！</b><br>

  <!-- 下部操作ボタン -->

    </button>
    <button id="btn-fire" class="ctrl-btn btn-shot">

      <small>SHOT (正面)</small>
    </button>

      <small>RIGHT</small>
    </button>

<script>
// --- 音響エンジン（Web Audio API / ワイド・バイノーラル音響） ---
let audioCtx = null;
let reverbConvolver = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    buildSpaceReverb();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 空間の臨場感を出すための微小な空間リバーブ（アンビエンス）を合成
function buildSpaceReverb() {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * 0.8; // 0.8秒の残響
  const impulse = audioCtx.createBuffer(2, length, sampleRate);
  const left = impulse.getChannelData(0);
  const right = impulse.getChannelData(1);

  for (let i = 0; i < length; i++) {
    const decay = Math.exp(-i / (sampleRate * 0.15)); // 急速に減衰する初期反射
    left[i] = (Math.random() * 2 - 1) * decay * 0.25;
    right[i] = (Math.random() * 2 - 1) * decay * 0.25;
  }

  reverbConvolver = audioCtx.createConvolver();
  reverbConvolver.buffer = impulse;

  // リバーブ専用の微小Gain（空間の空気感として薄く混ぜる）
  const reverbGain = audioCtx.createGain();
  reverbGain.gain.setValueAtTime(0.18, audioCtx.currentTime);
  reverbConvolver.connect(reverbGain);
  reverbGain.connect(audioCtx.destination);
}

/**
 * ★ ワイド・バイノーラル音場ルーティング ★
 * 人間が「広大な外側から聞こえる」と感じる両耳間時間差（ITD: 0〜0.7ms）と
 * 頭部シャドウ（ILD + 逆耳ローパス）を再現。
 */
function connectBinaural(sourceNode, targetLane, masterGain = 0.2) {
  const diff = targetLane - playerLane; // 自機からの相対列差 (-6 〜 +6)
  const now = audioCtx.currentTime;

  // チャンネルマージャー（ステレオ2ch出力）
  const merger = audioCtx.createChannelMerger(2);

  // 左耳用・右耳用のゲインとディレイ
  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  const leftDelay = audioCtx.createDelay(0.01);
  const rightDelay = audioCtx.createDelay(0.01);

  if (diff === 0) {
    // 【正面・ロックオン状態】
    // 両耳均等、ディレイなし（位相同期）でセンターにピタッと定位！
    leftGain.gain.setValueAtTime(masterGain, now);
    rightGain.gain.setValueAtTime(masterGain, now);
    leftDelay.delayTime.setValueAtTime(0, now);
    rightDelay.delayTime.setValueAtTime(0, now);

    sourceNode.connect(leftGain);
    sourceNode.connect(rightGain);
    leftGain.connect(merger, 0, 0); // ch0: L
    rightGain.connect(merger, 0, 1); // ch1: R
  } else {
    // 【左右にズレている状態】
    // 1列でもズレたらガッツリ外側（真横）へ広げる！
    const sign = Math.sign(diff); // -1: 左, +1: 右
    const absDiff = Math.abs(diff);

    // 時間差（ITD: 最大0.75ms）。反対側の耳に遅れて届くことで頭外の広大な空間を感じる
    const delayTime = Math.min(0.00075, 0.0003 + (absDiff * 0.0001));

    // 反対側の耳の音量を極限までカット（0.05〜0.02）し、超ワイドなセパレーションを実現
    const farEarGainVal = Math.max(0.01, 0.08 - (absDiff * 0.015));

    // 反対側の耳には頭の遮蔽で高音をカットするローパスフィルター
    const shadowFilter = audioCtx.createBiquadFilter();
    shadowFilter.type = 'lowpass';
    shadowFilter.frequency.setValueAtTime(700, now);

    if (sign < 0) {
      // 敵は左側
      leftGain.gain.setValueAtTime(masterGain, now);
      leftDelay.delayTime.setValueAtTime(0, now);

      rightGain.gain.setValueAtTime(masterGain * farEarGainVal, now);
      rightDelay.delayTime.setValueAtTime(delayTime, now);

      sourceNode.connect(leftGain);
      leftGain.connect(merger, 0, 0); // L

      sourceNode.connect(shadowFilter);
      shadowFilter.connect(rightDelay);
      rightDelay.connect(rightGain);
      rightGain.connect(merger, 0, 1); // R
    } else {
      // 敵は右側
      rightGain.gain.setValueAtTime(masterGain, now);
      rightDelay.delayTime.setValueAtTime(0, now);

      leftGain.gain.setValueAtTime(masterGain * farEarGainVal, now);
      leftDelay.delayTime.setValueAtTime(delayTime, now);

      sourceNode.connect(rightGain);
      rightGain.connect(merger, 0, 1); // R

      sourceNode.connect(shadowFilter);
      shadowFilter.connect(leftDelay);
      leftDelay.connect(leftGain);
      leftGain.connect(merger, 0, 0); // L
    }
  }

  // メイン出力と、臨場感アンビエンス（リバーブ）へ接続
  merger.connect(audioCtx.destination);
  if (reverbConvolver) {
    merger.connect(reverbConvolver);
  }
}

// 効果音集
const SFX = {
  // 自機移動音：大幅に音量を抑え、耳障りでない極小ソフトクリック（gain: 0.035）
  playerMove(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.025);

    panner.pan.setValueAtTime(dir < 0 ? -0.3 : 0.3, now);

    // ★ ごく控えめな音量
    gainNode.gain.setValueAtTime(0.035, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.025);

    osc.connect(gainNode);
    gainNode.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.025);
  },

  // 端にぶつかった音（控えめな低音タップ）
  wallBump(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(110, now);
    panner.pan.setValueAtTime(dir < 0 ? -0.9 : 0.9, now);

    gainNode.gain.setValueAtTime(0.08, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(gainNode);
    gainNode.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  },

  // プレイヤーショット（正面から前方へ突き抜ける爽快音）
  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(340, now);
    osc.frequency.exponentialRampToValueAtTime(1500, now + 0.12);

    gainNode.gain.setValueAtTime(0.22, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.12);
  },

  // 敵の断続パルス（超ワイドバイノーラル音場 & 距離音量）
  invaderPulse(lane, distRate, isLockedOn) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    // 距離（遠い=0.1 〜 目前=1.0）に応じた音量カーブ（遠くは控えめ、近づくとド迫力！）
    const masterGain = Math.max(0.03, Math.pow(distRate, 1.7) * 0.45);
    const filterFreq = 260 + (distRate * 3200);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterFreq, now);

    if (isLockedOn) {
      // 正面ロックオン時：高めでクリアな合致音「ピピッ！」
      osc.type = 'square';
      osc.frequency.setValueAtTime(640 + (distRate * 100), now);
      gainNode.gain.setValueAtTime(masterGain * 1.1, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      osc.connect(filter);
      filter.connect(gainNode);
      connectBinaural(gainNode, lane, masterGain);

      osc.start(now);
      osc.stop(now + 0.08);
    } else {
      // 左右にいる時：外側から響く重厚なパルス音「ドンッ…」
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180 + (distRate * 60), now);
      gainNode.gain.setValueAtTime(masterGain, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(filter);
      filter.connect(gainNode);
      connectBinaural(gainNode, lane, masterGain);

      osc.start(now);
      osc.stop(now + 0.09);
    }
  },

  // 迫る敵弾の音
  bulletApproaching(lane, distRate) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sine';
    const startFreq = 480 + (distRate * 280);
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, startFreq - 200), now + 0.1);

    const gain = 0.04 + (distRate * 0.28);
    gainNode.gain.setValueAtTime(gain, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

    osc.connect(gainNode);
    connectBinaural(gainNode, lane, gain);

    osc.start(now);
    osc.stop(now + 0.1);
  },

  // 敵撃破（バイノーラル爆発音）
  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.32;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1000, now);
    filter.frequency.linearRampToValueAtTime(80, now + 0.32);

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.45, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.32);

    noise.connect(filter);
    filter.connect(gainNode);
    connectBinaural(gainNode, lane, 0.45);

    noise.start(now);
    noise.stop(now + 0.32);
  },

  // ウェーブクリア
  waveClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }, idx * 100);
    });
  },

  // 被弾
  playerHit() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(85, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  },

  // ゲームオーバー
  gameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.8);
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.8);
  }
};

// --- ゲームロジック ---
const LANES = 7; // 0 〜 6
const MAX_Y = 10;

let playerLane = 3;
let score = 0;
let hp = 3;
let currentWave = 1;
let isGameOver = false;

let enemies = [];
let enemyStepIndex = 0;
let lastStepTime = 0;
let stepInterval = 1700; // ゆっくり

let lastPulseTime = 0;
const PULSE_INTERVAL = 680; // 約0.68秒おきに断続音

let playerBullets = [];
let enemyBullets = [];

function startWave(waveNum) {
  currentWave = waveNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];

  const enemyCount = Math.min(LANES, waveNum);
  let spawnLanes = [];

  if (enemyCount === 1) {
    // 最初の1体は自機(3)から離れた左1列に出現
    spawnLanes = [1];
  } else if (enemyCount === 2) {
    spawnLanes = [1, 5];
  } else if (enemyCount === 3) {
    spawnLanes = [0, 3, 6];
  } else {
    spawnLanes = [0, 1, 2, 3, 4, 5, 6].slice(0, enemyCount);
  }

  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      lane: spawnLanes[i],
      y: 1,
      alive: true
    });
  }

  stepInterval = Math.max(700, 1700 - (waveNum - 1) * 140);
  enemyDir = 1;
  enemyStepIndex = 0;
  updateUI();
}

let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  if (currentWave >= 2 && Math.random() < 0.22) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    enemyBullets.push({
      lane: shooter.lane,
      y: shooter.y
    });
  }
}

function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

function restartGame() {
  score = 0;
  hp = 3;
  playerLane = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startWave(1);
}

function endGame() {
  isGameOver = true;
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentWave;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('wave-val').textContent = currentWave;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneNames = ["0 (最左)", "1 (左中)", "2 (左微)", "3 (中央)", "4 (右微)", "5 (右中)", "6 (最右)"];
  document.getElementById('player-lane-txt').textContent = laneNames[playerLane] || playerLane;

  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に捕捉！今すぐ撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音の方向へ移動して捕捉";
  }
}

// --- メインループ ---
let lastTime = 0;
let bulletWarningTimer = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // 敵の断続音
  if (time - lastPulseTime > PULSE_INTERVAL) {
    lastPulseTime = time;
    const aliveEnemies = enemies.filter(e => e.alive);
    if (aliveEnemies.length > 0) {
      const soundEnemy = aliveEnemies[enemyStepIndex % aliveEnemies.length];
      enemyStepIndex++;

      const distRate = soundEnemy.y / MAX_Y;
      const isLockedOn = (soundEnemy.lane === playerLane);

      SFX.invaderPulse(soundEnemy.lane, distRate, isLockedOn);
    }
  }

  // プレイヤー弾
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.24;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentWave;
        SFX.enemyExplode(e.lane);
        updateUI();

        const remaining = enemies.filter(enemy => enemy.alive).length;
        if (remaining === 0) {
          SFX.waveClear();
          setTimeout(() => {
            startWave(currentWave + 1);
          }, 1000);
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // 敵弾
  bulletWarningTimer += dt;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += 0.035;

    if (eb.y >= MAX_Y - 0.3 && eb.y <= MAX_Y + 0.3) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      }
    }

    if (eb.y > MAX_Y + 0.5) {
      enemyBullets.splice(i, 1);
    }
  }

  if (enemyBullets.length > 0 && bulletWarningTimer > 320) {
    bulletWarningTimer = 0;
    const closestBullet = [...enemyBullets].sort((a, b) => b.y - a.y)[0];
    if (closestBullet) {
      const distRate = closestBullet.y / MAX_Y;
      SFX.bulletApproaching(closestBullet.lane, distRate);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 1);

  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.45)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `左${Math.abs(relDiff)}`;
    else relText = `右${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 11px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 20);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.4 : laneW * 0.32, 0, Math.PI * 2);
    ctx.fill();

    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 3, y - 8, 6, 16);
  }

  ctx.fillStyle = '#ffcc00';
  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startWave(1);
});

document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 7音階リスト（完全ランダムに敵に割り当て）
const ENEMY_FREQS = [220, 277, 330, 415, 494, 554, 660];

/**
 * ★ 全9列（0〜8、中央4）の超高分離ワイド空間音響パラメータ ★
 * 左右のパン差を大幅に強化！
 * 1列ズレただけでも反対耳を急激に減衰（約80%カット）させ、
 * イヤホンで左右のズレ・位置が明確に判別できるように設定。
 * かつ、受音側（手前耳）の音量は減衰させず、前方距離に応じた本来の音量をキープ！
 */
function get9LaneSpatialParams(targetLane) {
  const diff = targetLane - playerLane; // -8 〜 +8
  const absDiff = Math.abs(diff);
  const sign = Math.sign(diff); // -1: 左, 0: 正面, 1: 右

  if (diff === 0) {
    // 正面：左右の耳に等しく100%の音量 ＆ 遅延ゼロ（完全なセンター定位）
    return {
      pan: 0.0,
      leftVol: 1.0,
      rightVol: 1.0,
      leftDelay: 0,
      rightDelay: 0
    };
  }

  // 左右の大幅なパン差（反対耳の音量比率）
  // 1列差: 0.20 (約-14dB。1列離れただけでも劇的に片側に寄る！)
  // 2列差: 0.08 (約-22dB。圧倒的に横方向)
  // 3列差: 0.03 (約-30dB。ほぼ完全に片耳)
  // 4列差: 0.01
  // 5列差以上: 0.00 (完全な真横・片側のみ)
  const farEarSteps = [1.0, 0.20, 0.08, 0.03, 0.01, 0.003, 0.001, 0.0002, 0.0];
  const farRatio = farEarSteps[absDiff] !== undefined ? farEarSteps[absDiff] : 0.0;

  // 耳間時間差（ITD）: 音の方向を脳が判別するための微小遅延 (0 〜 0.90ms)
  const delaySteps = [0, 0.00022, 0.00040, 0.00058, 0.00072, 0.00080, 0.00085, 0.00088, 0.00090];
  const delayTime = delaySteps[absDiff] || 0.00090;

  // パン値 (-1.0 〜 +1.0)
  const panSteps = [0.0, 0.65, 0.85, 0.94, 0.98, 0.995, 0.999, 1.0, 1.0];
  const panVal = sign * (panSteps[absDiff] || 1.0);

  if (sign < 0) {
    // 左側にいる敵・弾：左耳が100%（遅延ゼロ）、右耳が大幅減衰＋遅延
    return {
      pan: panVal,
      leftVol: 1.0,
      rightVol: farRatio,
      leftDelay: 0,
      rightDelay: delayTime
    };
  } else {
    // 右側にいる敵・弾：右耳が100%（遅延ゼロ）、左耳が大幅減衰＋遅延
    return {
      pan: panVal,
      leftVol: farRatio,
      rightVol: 1.0,
      leftDelay: delayTime,
      rightDelay: 0
    };
  }
}

/**
 * 敵のステップ発音（9列・等音量バイノーラル空間定位）
 * 前方の距離（distRate）のみで音量を決定し、左右の距離による音量減衰は行わない
 */
function playSpatialTone({ freq, duration = 0.14, lane, distRate = 0.5, type = 'sine' }) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  const spatial = get9LaneSpatialParams(lane);
  // 前方の距離（distRate: 0.1〜1.0）のみで音量を決定
  const baseGain = 0.05 + Math.pow(distRate, 1.3) * 0.32;

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc2Gain = audioCtx.createGain();

  osc1.type = type;
  osc1.frequency.setValueAtTime(freq, now);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, now);
  osc2Gain.gain.setValueAtTime(0.2, now);
  osc2.connect(osc2Gain);

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(baseGain, now);
  vca.gain.exponentialRampToValueAtTime(0.001, now + duration);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800 + (distRate * 2400), now);

  osc1.connect(filter);
  osc2Gain.connect(filter);
  filter.connect(vca);

  const merger = audioCtx.createChannelMerger(2);
  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  const leftDelay = audioCtx.createDelay(0.01);
  const rightDelay = audioCtx.createDelay(0.01);

  leftGain.gain.setValueAtTime(spatial.leftVol, now);
  rightGain.gain.setValueAtTime(spatial.rightVol, now);
  leftDelay.delayTime.setValueAtTime(spatial.leftDelay, now);
  rightDelay.delayTime.setValueAtTime(spatial.rightDelay, now);

  vca.connect(leftDelay);
  leftDelay.connect(leftGain);
  leftGain.connect(merger, 0, 0); // L

  vca.connect(rightDelay);
  rightDelay.connect(rightGain);
  rightGain.connect(merger, 0, 1); // R

  merger.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + duration);
  osc2.stop(now + duration);
}

// 効果音集
const SFX = {
  playerMove(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.02);

    panner.pan.setValueAtTime(dir < 0 ? -0.4 : 0.4, now);

    g.gain.setValueAtTime(0.03, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.02);
  },

  wallBump(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    panner.pan.setValueAtTime(dir < 0 ? -0.9 : 0.9, now);

    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.04);
  },

  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const highpass = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);

    highpass.type = 'highpass';
    highpass.frequency.setValueAtTime(700, now);

    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(highpass);
    highpass.connect(g);
    g.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  },

  // ★ 初期型の敵弾接近音（風切り・レーザー下降音）★
  // 前方の距離（distRate）のみで音量・周波数をスケールし、左右の距離は等音量バイノーラル定位で表現
  bulletApproaching(lane, distRate) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const spatial = get9LaneSpatialParams(lane);
    const gain = 0.06 + (distRate * 0.28);

    const osc = audioCtx.createOscillator();
    const vca = audioCtx.createGain();

    // 初期型の滑らかなピュン音
    const baseFreq = 420 + (distRate * 280);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(80, baseFreq - 170), now + 0.12);

    vca.gain.setValueAtTime(gain, now);
    vca.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    // 左右等音量バイノーラル定位
    const merger = audioCtx.createChannelMerger(2);
    const leftGain = audioCtx.createGain();
    const rightGain = audioCtx.createGain();
    const leftDelay = audioCtx.createDelay(0.01);
    const rightDelay = audioCtx.createDelay(0.01);

    leftGain.gain.setValueAtTime(spatial.leftVol, now);
    rightGain.gain.setValueAtTime(spatial.rightVol, now);
    leftDelay.delayTime.setValueAtTime(spatial.leftDelay, now);
    rightDelay.delayTime.setValueAtTime(spatial.rightDelay, now);

    osc.connect(vca);
    vca.connect(leftDelay);
    leftDelay.connect(leftGain);
    leftGain.connect(merger, 0, 0); // L

    vca.connect(rightDelay);
    rightDelay.connect(rightGain);
    rightGain.connect(merger, 0, 1); // R

    merger.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.12);
  },

  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(550, now);
    filter.Q.setValueAtTime(1.5, now);

    const spatial = get9LaneSpatialParams(lane);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    const merger = audioCtx.createChannelMerger(2);
    const leftGain = audioCtx.createGain();
    const rightGain = audioCtx.createGain();
    const leftDelay = audioCtx.createDelay(0.01);
    const rightDelay = audioCtx.createDelay(0.01);

    leftGain.gain.setValueAtTime(spatial.leftVol, now);
    rightGain.gain.setValueAtTime(spatial.rightVol, now);
    leftDelay.delayTime.setValueAtTime(spatial.leftDelay, now);
    rightDelay.delayTime.setValueAtTime(spatial.rightDelay, now);

    noise.connect(filter);
    filter.connect(g);

    g.connect(leftDelay);
    leftDelay.connect(leftGain);
    leftGain.connect(merger, 0, 0);

    g.connect(rightDelay);
    rightDelay.connect(rightGain);
    rightGain.connect(merger, 0, 1);

    merger.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.2);
  },

  phaseClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }, idx * 90);
    });
  },

  playerHit() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  gameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.7);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }
};

// --- ゲームロジック ---
const LANES = 9; // ★ 全9列に変更 (0 〜 8) ★
const MAX_Y = 10;
const MAX_ON_SCREEN_ENEMIES = 4; // 敵の最大同時発生数は4体

let playerLane = 4; // 初期位置: 中央4
let score = 0;
let hp = 3;
let currentPhase = 1;
let quotaRemaining = 3;
let isGameOver = false;

let enemies = [];
let lastStepTime = 0;
let stepInterval = 2400;

let lastBeatTime = 0;
let currentEnemyBeatIndex = 0;

let playerBullets = [];
let enemyBullets = [];
let bulletWarningTimer = 0;

// 敵を1体スポーン（9列から空きレーンを選択、音階は完全ランダム）
function spawnEnemy() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length >= MAX_ON_SCREEN_ENEMIES) return;

  const occupiedLanes = aliveEnemies.map(e => e.lane);
  const freeLanes = [];
  for (let i = 0; i < LANES; i++) {
    if (!occupiedLanes.includes(i)) freeLanes.push(i);
  }
  const chosenLane = freeLanes.length > 0
    ? freeLanes[Math.floor(Math.random() * freeLanes.length)]
    : Math.floor(Math.random() * LANES);

  const randomFreq = ENEMY_FREQS[Math.floor(Math.random() * ENEMY_FREQS.length)];

  enemies.push({
    lane: chosenLane,
    y: 1,
    alive: true,
    freq: randomFreq
  });
}

// フェーズ初期化
function startPhase(phaseNum) {
  currentPhase = phaseNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];
  bulletWarningTimer = 0;
  currentEnemyBeatIndex = 0;

  quotaRemaining = 3 + (phaseNum - 1) * 2;

  // 画面内の初期敵数（最大4体まで）
  const initialEnemies = Math.min(MAX_ON_SCREEN_ENEMIES, Math.min(phaseNum, 4));
  for (let i = 0; i < initialEnemies; i++) {
    spawnEnemy();
  }

  // フェーズごとの速度上昇
  stepInterval = Math.max(900, 2400 - (phaseNum - 1) * 240);
  enemyDir = 1;
  updateUI();
}

let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  // 射撃判定（フェーズ1は発射なし、フェーズ2以降緩やかに上昇）
  const shootChance = currentPhase === 1 ? 0 : Math.min(0.35, 0.08 + (currentPhase - 1) * 0.05);

  if (Math.random() < shootChance) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    enemyBullets.push({
      lane: shooter.lane,
      y: shooter.y,
      speed: 0.040
    });
    // 発射時にも接近音を即座に1回鳴らす
    const distRate = shooter.y / MAX_Y;
    SFX.bulletApproaching(shooter.lane, distRate);
  }
}

function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

function restartGame() {
  score = 0;
  hp = 3;
  playerLane = 4; // 中央4
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startPhase(1);
}

function endGame() {
  isGameOver = true;
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentPhase;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('phase-val').textContent = currentPhase;
  document.getElementById('quota-val').textContent = quotaRemaining;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneLabel = playerLane === 4 ? "4 (中央)" : playerLane;
  document.getElementById('player-lane-txt').textContent = laneLabel;

  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に敵の音！撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音を正面に捉えて撃て";
  }
}

// --- メインループ ---
let lastTime = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  // 敵の歩進
  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // アルペジオ足音発音（前方の距離＝音量、左右の距離＝等音量定位）
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length > 0) {
    const interval = aliveEnemies.length === 1 ? 550 : Math.max(260, 520 / aliveEnemies.length);

    if (time - lastBeatTime > interval) {
      lastBeatTime = time;
      const targetEnemy = aliveEnemies[currentEnemyBeatIndex % aliveEnemies.length];
      currentEnemyBeatIndex++;

      const distRate = targetEnemy.y / MAX_Y;
      playSpatialTone({
        freq: targetEnemy.freq,
        duration: 0.14,
        lane: targetEnemy.lane,
        distRate: distRate,
        type: 'sine'
      });
    }
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.26;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentPhase;
        quotaRemaining--;
        SFX.enemyExplode(e.lane);
        updateUI();

        if (quotaRemaining <= 0) {
          SFX.phaseClear();
          setTimeout(() => {
            startPhase(currentPhase + 1);
          }, 1100);
          break;
        } else {
          // ノルマ未達：最大4体まで新敵を補充
          const currentAlive = enemies.filter(enemy => enemy.alive).length;
          if (currentAlive < MAX_ON_SCREEN_ENEMIES) {
            setTimeout(() => {
              if (!isGameOver && quotaRemaining > 0) {
                spawnEnemy();
              }
            }, 750);
          }
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // ★ 敵弾移動 ＆ 初期型ピュンピュン接近音 ★
  bulletWarningTimer += dt;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += eb.speed;

    // 自機ライン判定
    if (eb.y >= MAX_Y - 0.25 && eb.y <= MAX_Y + 0.35) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      }
    }

    if (eb.y > MAX_Y + 0.6) {
      enemyBullets.splice(i, 1);
    }
  }

  // 迫る敵弾の接近音を定期的に発音（避ける手がかり）
  if (enemyBullets.length > 0 && bulletWarningTimer > 250) {
    bulletWarningTimer = 0;
    // 最も自機に近い弾
    const closestBullet = [...enemyBullets].sort((a, b) => b.y - a.y)[0];
    if (closestBullet) {
      const distRate = closestBullet.y / MAX_Y;
      SFX.bulletApproaching(closestBullet.lane, distRate);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 2);

  // 9列描画
  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.45)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `L${Math.abs(relDiff)}`;
    else relText = `R${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 10px sans-serif' : '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 16);
  }

  // 敵（最大4体）
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.42 : laneW * 0.34, 0, Math.PI * 2);
    ctx.fill();

    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 2, 2, 2);
    ctx.fillRect(x + 1, y - 2, 2, 2);
  }

  // プレイヤー弾
  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 2, y - 8, 4, 16);
  }

  // 敵弾
  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 自機
  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 12);
  ctx.lineTo(px - 10, py + 10);
  ctx.lineTo(px + 10, py + 10);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startPhase(1);
});

document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

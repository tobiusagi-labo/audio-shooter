<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const ENEMY_FREQS = [220, 277, 330, 415, 494, 554, 660];

/**
 * ★ 段階的定位（1列〜6列差の精密な聞き分け）★
 * 1列隣でも5列離れていても同じに聞こえる問題を解決！
 * 列差ごとに段階的にパンと音量・遅延を滑らかに変化させ、
 * 「すぐ隣（小角度）」〜「真横」〜「遥か遠い端（外側）」を完璧に分離。
 */
function getLinearSpatialParams(targetLane) {
  const diff = targetLane - playerLane; // -6 〜 +6
  const absDiff = Math.abs(diff);
  const sign = Math.sign(diff); // -1: 左, 0: 正面, 1: 右

  if (diff === 0) {
    return {
      pan: 0.0,
      leftVol: 1.0,
      rightVol: 1.0,
      leftDelay: 0,
      rightDelay: 0,
      distanceAttenuation: 1.0 // 正面は最もクリア
    };
  }

  // 列差ごとの段階的ステレオパン設定
  // 1列差: 0.28 (少し斜め)
  // 2列差: 0.52 (斜め)
  // 3列差: 0.72 (しっかり横)
  // 4列差: 0.86 (深い横)
  // 5列差: 0.95 (ほぼ真横外側)
  // 6列差: 1.00 (完全な端)
  const panSteps = [0, 0.28, 0.52, 0.72, 0.86, 0.95, 1.0];
  const panVal = sign * (panSteps[absDiff] || 1.0);

  // 反対耳の音量比率（1列ズレなら0.65残り、離れるほど徐々に減少）
  const farEarSteps = [1.0, 0.65, 0.42, 0.22, 0.12, 0.06, 0.02];
  const farRatio = farEarSteps[absDiff] || 0.02;

  // 両耳間時間差（ITD）: 離れるほどミリ秒遅延が増加
  const delayTime = Math.min(0.0007, absDiff * 0.00012);

  // 横に離れるほど物理距離が遠くなるため音量を自然に減衰（5列離れている敵は小さく遠く感じる）
  const distAttenuation = Math.max(0.45, 1.0 - (absDiff * 0.09));

  if (sign < 0) {
    return {
      pan: panVal,
      leftVol: 1.0 * distAttenuation,
      rightVol: farRatio * distAttenuation,
      leftDelay: 0,
      rightDelay: delayTime,
      distanceAttenuation: distAttenuation
    };
  } else {
    return {
      pan: panVal,
      rightVol: 1.0 * distAttenuation,
      leftVol: farRatio * distAttenuation,
      rightDelay: 0,
      leftDelay: delayTime,
      distanceAttenuation: distAttenuation
    };
  }
}

/**
 * 敵のアルペジオ・ステップ音（段階的定位出力）
 */
function playSpatialTone({ freq, duration = 0.12, lane, distRate = 0.5, type = 'sine' }) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  const spatial = getLinearSpatialParams(lane);

  // 前後の距離に応じた基本音量（奥は小さく、手前は大きく）
  const baseGain = Math.max(0.03, Math.pow(distRate, 1.4) * 0.35) * spatial.distanceAttenuation;

  // オシレーター（耳に優しいサイン波＋微細倍音）
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc2Gain = audioCtx.createGain();

  osc1.type = type;
  osc1.frequency.setValueAtTime(freq, now);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, now);
  osc2Gain.gain.setValueAtTime(0.2, now);
  osc2.connect(osc2Gain);

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(baseGain, now);
  vca.gain.exponentialRampToValueAtTime(0.001, now + duration);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(900 + (distRate * 2500), now);

  osc1.connect(filter);
  osc2Gain.connect(filter);
  filter.connect(vca);

  // 段階的バイノーラル出力
  const merger = audioCtx.createChannelMerger(2);
  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  const leftDelay = audioCtx.createDelay(0.01);
  const rightDelay = audioCtx.createDelay(0.01);

  leftGain.gain.setValueAtTime(spatial.leftVol, now);
  rightGain.gain.setValueAtTime(spatial.rightVol, now);
  leftDelay.delayTime.setValueAtTime(spatial.leftDelay, now);
  rightDelay.delayTime.setValueAtTime(spatial.rightDelay, now);

  vca.connect(leftDelay);
  leftDelay.connect(leftGain);
  leftGain.connect(merger, 0, 0); // L

  vca.connect(rightDelay);
  rightDelay.connect(rightGain);
  rightGain.connect(merger, 0, 1); // R

  merger.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + duration);
  osc2.stop(now + duration);
}

/**
 * ★ 敵の攻撃弾：耳に優しい「ソフト・プラズマ音（連続音）」★
 * ノコギリ波の不快なブザー音を完全撤廃！
 * サイン波を基調とした、滑らかで心地よいSF風プラズマ音（フォオオオ…）
 */
function createEnemyBulletSound(bullet) {
  if (!audioCtx) return null;
  const now = audioCtx.currentTime;

  // 基音（柔らかなサイン波）
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(260, now);

  // わずかな浮遊感を出す第2サイン波（わずかにデチューンして厚みを付与）
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(264, now);

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(0.02, now);

  // 耳障りな高域をカットするソフトローパスフィルター
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(450, now);

  const panner = audioCtx.createStereoPanner();

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(panner);
  panner.connect(vca);
  vca.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);

  return {
    osc1, osc2, vca, panner, filter,
    isPassingBack: false,
    cleanup() {
      try {
        const stopTime = audioCtx.currentTime + 0.05;
        vca.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
        osc1.stop(stopTime);
        osc2.stop(stopTime);
      } catch (e) {}
    }
  };
}

// 効果音集
const SFX = {
  // 自機移動音
  playerMove(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.02);

    panner.pan.setValueAtTime(dir < 0 ? -0.3 : 0.3, now);

    g.gain.setValueAtTime(0.03, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.02);
  },

  // 壁限界音
  wallBump(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    panner.pan.setValueAtTime(dir < 0 ? -0.8 : 0.8, now);

    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.04);
  },

  // 自機ショット音（シャープでキレのある高域レーザー）
  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const highpass = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);

    highpass.type = 'highpass';
    highpass.frequency.setValueAtTime(700, now);

    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(highpass);
    highpass.connect(g);
    g.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  },

  // 敵撃破
  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(600, now);
    filter.Q.setValueAtTime(1.5, now);

    const panner = audioCtx.createStereoPanner();
    const spatial = getLinearSpatialParams(lane);
    panner.pan.setValueAtTime(spatial.pan, now);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    noise.connect(filter);
    filter.connect(panner);
    panner.connect(g);
    g.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.2);
  },

  // ウェーブクリア
  waveClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }, idx * 90);
    });
  },

  // 被弾
  playerHit() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  // ゲームオーバー
  gameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.7);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }
};

// --- ゲームロジック ---
const LANES = 7;
const MAX_Y = 10;

let playerLane = 3;
let score = 0;
let hp = 3;
let currentWave = 1;
let isGameOver = false;

let enemies = [];
let lastStepTime = 0;
let stepInterval = 2400; // 敵のゆったりした移動間隔

let lastBeatTime = 0;
let currentEnemyBeatIndex = 0;

let playerBullets = [];
let enemyBullets = [];

function clearAllBulletsAudio() {
  for (const b of enemyBullets) {
    if (b.soundNodes) {
      b.soundNodes.cleanup();
      b.soundNodes = null;
    }
  }
}

function startWave(waveNum) {
  clearAllBulletsAudio();
  currentWave = waveNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];
  currentEnemyBeatIndex = 0;

  const enemyCount = Math.min(LANES, waveNum);
  let spawnLanes = [];

  if (enemyCount === 1) {
    spawnLanes = [1];
  } else if (enemyCount === 2) {
    spawnLanes = [1, 5];
  } else if (enemyCount === 3) {
    spawnLanes = [0, 3, 6];
  } else {
    spawnLanes = [0, 1, 2, 3, 4, 5, 6].slice(0, enemyCount);
  }

  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      lane: spawnLanes[i],
      y: 1,
      alive: true,
      freq: ENEMY_FREQS[i % ENEMY_FREQS.length]
    });
  }

  stepInterval = Math.max(1300, 2400 - (waveNum - 1) * 180);
  enemyDir = 1;
  updateUI();
}

let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  // 敵の弾発射
  if (currentWave >= 2 && Math.random() < 0.25) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    const bulletObj = {
      lane: shooter.lane,
      y: shooter.y,
      speed: 0.038,
      passed: false,
      soundNodes: null
    };
    bulletObj.soundNodes = createEnemyBulletSound(bulletObj);
    enemyBullets.push(bulletObj);
  }
}

function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

function restartGame() {
  clearAllBulletsAudio();
  score = 0;
  hp = 3;
  playerLane = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startWave(1);
}

function endGame() {
  isGameOver = true;
  clearAllBulletsAudio();
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentWave;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('wave-val').textContent = currentWave;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneNames = ["0 (最左)", "1 (左中)", "2 (左微)", "3 (中央)", "4 (右微)", "5 (右中)", "6 (最右)"];
  document.getElementById('player-lane-txt').textContent = laneNames[playerLane] || playerLane;

  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に敵の音！撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音を正面に捉えて撃て";
  }
}

// --- メインループ ---
let lastTime = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  // 敵の歩進
  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // アルペジオ発音
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length > 0) {
    const interval = aliveEnemies.length === 1 ? 550 : Math.max(260, 500 / aliveEnemies.length);

    if (time - lastBeatTime > interval) {
      lastBeatTime = time;
      const targetEnemy = aliveEnemies[currentEnemyBeatIndex % aliveEnemies.length];
      currentEnemyBeatIndex++;

      const distRate = targetEnemy.y / MAX_Y;
      playSpatialTone({
        freq: targetEnemy.freq,
        duration: 0.14,
        lane: targetEnemy.lane,
        distRate: distRate,
        type: 'sine'
      });
    }
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.26;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentWave;
        SFX.enemyExplode(e.lane);
        updateUI();

        const remaining = enemies.filter(enemy => enemy.alive).length;
        if (remaining === 0) {
          SFX.waveClear();
          setTimeout(() => {
            startWave(currentWave + 1);
          }, 900);
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // ★ 敵弾移動 ＆ 柔らかな連続プラズマ音・回避後方通過 ★
  const now = audioCtx.currentTime;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += eb.speed;

    const spatial = getLinearSpatialParams(eb.lane);
    const distRate = eb.y / MAX_Y;

    if (eb.soundNodes) {
      const nodes = eb.soundNodes;

      if (!eb.passed) {
        // 自機の手前に迫る段階：段階的ステレオパンで迫る（フォオオオ…）
        nodes.panner.pan.setTargetAtTime(spatial.pan, now, 0.02);

        // 距離に応じた音量＆フィルター（耳障りでない丸い音）
        const vol = 0.03 + (distRate * 0.22);
        nodes.vca.gain.setTargetAtTime(vol, now, 0.02);
        nodes.filter.frequency.setTargetAtTime(320 + (distRate * 450), now, 0.02);
        nodes.osc1.frequency.setTargetAtTime(240 + (distRate * 70), now, 0.02);
        nodes.osc2.frequency.setTargetAtTime(244 + (distRate * 70), now, 0.02);
      } else {
        // 回避成功：背後へ抜けるドップラー減衰（スウウウーーーン…↓）
        if (!nodes.isPassingBack) {
          nodes.isPassingBack = true;
          nodes.osc1.frequency.exponentialRampToValueAtTime(70, now + 0.6);
          nodes.osc2.frequency.exponentialRampToValueAtTime(72, now + 0.6);
          nodes.filter.frequency.exponentialRampToValueAtTime(140, now + 0.6);
          nodes.vca.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        }
      }
    }

    // 自機ライン（MAX_Y）判定
    if (!eb.passed && eb.y >= MAX_Y - 0.2) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        if (eb.soundNodes) eb.soundNodes.cleanup();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      } else {
        eb.passed = true; // 回避成功！
      }
    }

    // 後方完全通過
    if (eb.y > MAX_Y + 2.5) {
      if (eb.soundNodes) eb.soundNodes.cleanup();
      enemyBullets.splice(i, 1);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 2);

  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.45)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `左${Math.abs(relDiff)}`;
    else relText = `右${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 11px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 18);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.4 : laneW * 0.32, 0, Math.PI * 2);
    ctx.fill();

    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 2, y - 8, 4, 16);
  }

  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.fillStyle = eb.passed ? 'rgba(255, 204, 0, 0.3)' : '#ffcc00';
    ctx.beginPath();
    ctx.arc(x, y, eb.passed ? 4 : 6, 0, Math.PI * 2);
    ctx.fill();
  }

  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startWave(1);
});

document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

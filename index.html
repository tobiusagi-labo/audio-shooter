<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Audio Invaders 7-Lane</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #0b0c10;
    color: #66fcf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ヘッダーエリア */
  header {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #1f2833;
    font-size: 13px;
    z-index: 10;
    border-bottom: 1px solid #45a29e;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-box {
    font-weight: bold;
    font-size: 15px;
    color: #66fcf1;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .hdr-btn {
    background: #45a29e;
    color: #0b0c10;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }
  .hdr-btn.restart {
    background: #ffcc00;
  }

  /* パン設定バー */
  .pan-setting-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #c5c6c7;
    background: #11141a;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .pan-btn-group {
    display: flex;
    gap: 4px;
  }
  .pan-btn {
    background: #2a3b4c;
    color: #66fcf1;
    border: 1px solid #45a29e;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
  }
  .pan-btn.active {
    background: #66fcf1;
    color: #0b0c10;
  }

  /* ゲームメイン画面（レーダー表示） */
  #game-view {
    flex: 1;
    position: relative;
    background: #0b0c10;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  canvas {
    background: #11141a;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.15);
  }

  /* 目隠し（ブラインド）オーバーレイ */
  #blind-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #45a29e;
    z-index: 5;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    pointer-events: none;
  }
  #blind-overlay.active {
    display: flex;
  }
  #blind-overlay h2 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #66fcf1;
  }
  #blind-overlay p {
    font-size: 14px;
    line-height: 1.6;
    color: #c5c6c7;
  }

  /* スマホ操作ボタンエリア */
  #controls {
    display: flex;
    height: 120px;
    background: #1f2833;
    padding: 8px;
    gap: 8px;
    z-index: 10;
    border-top: 2px solid #45a29e;
  }
  .ctrl-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.05s, background-color 0.1s;
  }
  .ctrl-btn:active {
    transform: scale(0.96);
  }
  .ctrl-btn small {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 4px;
    font-weight: normal;
  }
  .btn-move {
    background: #2a3b4c;
    color: #66fcf1;
  }
  .btn-move:active {
    background: #3b526b;
  }
  .btn-shot {
    background: #ff0055;
    color: #fff;
    flex: 1.2;
    box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
  }
  .btn-shot:active {
    background: #e6004c;
  }

  /* オーバーレイ共通（スタート / ゲームオーバー / ウェーブクリア） */
  .modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 12, 16, 0.94);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  .action-btn {
    margin-top: 20px;
    background: #66fcf1;
    color: #0b0c10;
    border: none;
    padding: 14px 32px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
  }
  .action-btn.danger {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
  }
</style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="score-box">WAVE <span id="wave-val">1</span> | HP <span id="hp-val">3</span> | SCORE <span id="score-val">0</span></div>
      <div class="header-btns">
        <button id="restart-header-btn" class="hdr-btn restart">🔄 最初から</button>
        <button id="toggle-visual-btn" class="hdr-btn">👁️ 目隠し</button>
      </div>
    </div>
    <div class="pan-setting-bar">
      <span>🎧 パンの広がり:</span>
      <div class="pan-btn-group">
        <button class="pan-btn" data-multiplier="1">標準(1x)</button>
        <button class="pan-btn" data-multiplier="2">2倍</button>
        <button class="pan-btn" data-multiplier="5">5倍</button>
        <button class="pan-btn active" data-multiplier="10">超広域(10x)</button>
      </div>
    </div>
  </header>

  <div id="game-view">
    <canvas id="radarCanvas"></canvas>

    <!-- 目隠し（ブラインド）プレイ画面 -->
    <div id="blind-overlay">
      <h2>🎧 ブラインドプレイ中</h2>
      <p>画面を見ずに、イヤホンの音だけで<br>敵の位置を感じて撃破＆回避！</p>
      <p style="margin-top: 15px; font-size: 12px; color: #888;">上部の「👁️ 目隠し」でレーダーを確認できます</p>
    </div>

    <!-- 初回スタート画面 -->
    <div id="start-screen" class="modal-overlay">
      <h1 style="color:#66fcf1; margin-bottom: 12px;">AUDIO INVADERS</h1>
      <p style="line-height: 1.8; color:#c5c6c7; font-size: 15px;">
        ⚠️ <b>イヤホン・ヘッドホン必須</b><br>
        全7列の音響で敵を探して撃つ！<br>
        最初は1体からゆっくり始まります。<br>
        敵弾の音が迫ったら別の列へ逃げてください。
      </p>
      <button id="start-btn" class="action-btn">🎧 タップしてスタート</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="modal-overlay" style="display: none;">
      <h1 style="color:#ff0055; margin-bottom: 12px;">GAME OVER</h1>
      <p style="font-size: 18px; color:#fff; margin-bottom: 8px;">最終WAVE: <span id="final-wave">1</span></p>
      <p style="font-size: 16px; color:#c5c6c7;">スコア: <span id="final-score">0</span></p>
      <button id="restart-modal-btn" class="action-btn danger">🔄 もう一度遊ぶ</button>
    </div>
  </div>

  <!-- 下部特大コントローラー（スマホ用） -->
  <div id="controls">
    <button id="btn-left" class="ctrl-btn btn-move">
      ◀ 左移動
      <small>LEFT</small>
    </button>
    <button id="btn-fire" class="ctrl-btn btn-shot">
      🔥 撃つ
      <small>SHOT</small>
    </button>
    <button id="btn-right" class="ctrl-btn btn-move">
      右移動 ▶
      <small>RIGHT</small>
    </button>
  </div>

<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;
let panMultiplier = 10; // デフォルト10倍パン

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// 7列（0:最左 〜 3:中央 〜 6:最右）のステレオパン計算
function getPan(lane) {
  const norm = (lane - 3) / 3; // -1.0, -0.66, -0.33, 0.0, 0.33, 0.66, 1.0
  // パン倍率を適用（10倍なら中央以外はほぼ完全に左右へ振り切る）
  const scaled = norm * panMultiplier;
  return Math.max(-1.0, Math.min(1.0, scaled));
}

// 汎用サウンド再生ヘルパー
function playTone({ freq, type = 'square', duration = 0.1, pan = 0, gain = 0.2, pitchDecay = 0, filterFreq = null }) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (pitchDecay !== 0) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + pitchDecay), now + duration);
  }

  panner.pan.setValueAtTime(pan, now);

  gainNode.gain.setValueAtTime(gain, now);
  gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

  let lastNode = osc;
  if (filterFreq) {
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterFreq, now);
    lastNode.connect(filter);
    lastNode = filter;
  }

  lastNode.connect(panner);
  panner.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + duration);
}

// 効果音集
const SFX = {
  // 自機移動音（自分の現在レーンから鳴る）
  playerMove(lane) {
    playTone({ freq: 650, type: 'triangle', duration: 0.06, pan: getPan(lane), gain: 0.25 });
  },
  // 端にぶつかった音（壁）
  wallBump(lane) {
    playTone({ freq: 150, type: 'sawtooth', duration: 0.1, pan: getPan(lane), gain: 0.3 });
  },
  // プレイヤーショット（自機レーンから上昇）
  playerShot(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);

    panner.pan.setValueAtTime(getPan(lane), now);

    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

    osc.connect(panner);
    panner.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.15);
  },
  // 敵の足音/ビーコン
  invaderStep(lane, distRate, noteIndex) {
    const baseFreqs = [170, 150, 130, 110];
    const freq = baseFreqs[noteIndex % baseFreqs.length];

    // 距離が近いほど音量UP & 高域フィルター開放
    const gain = 0.08 + (distRate * 0.25);
    const filterFreq = 280 + (distRate * 2600);

    playTone({
      freq: freq + (distRate * 35),
      type: 'square',
      duration: 0.12,
      pan: getPan(lane),
      gain: gain,
      filterFreq: filterFreq
    });
  },
  // 迫る敵弾の音
  bulletApproaching(lane, distRate) {
    const gain = 0.06 + (distRate * 0.22);
    playTone({
      freq: 420 + (distRate * 280),
      pitchDecay: -160,
      type: 'sine',
      duration: 0.14,
      pan: getPan(lane),
      gain: gain
    });
  },
  // 敵撃破（爆発ノイズ）
  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, now);
    filter.frequency.linearRampToValueAtTime(100, now + 0.3);

    const panner = audioCtx.createStereoPanner();
    panner.pan.setValueAtTime(getPan(lane), now);

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.4, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

    noise.connect(filter);
    filter.connect(panner);
    panner.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.3);
  },
  // ウェーブクリアファンファーレ
  waveClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        playTone({ freq: f, type: 'triangle', duration: 0.18, pan: 0, gain: 0.25 });
      }, idx * 100);
    });
  },
  // プレイヤー被弾
  playerHit() {
    playTone({ freq: 90, pitchDecay: -50, type: 'sawtooth', duration: 0.4, pan: 0, gain: 0.5 });
  },
  // ゲームオーバー
  gameOver() {
    playTone({ freq: 220, pitchDecay: -120, type: 'sawtooth', duration: 0.8, pan: 0, gain: 0.4 });
  }
};

// --- ゲームロジック ---
const LANES = 7; // 0 〜 6
const MAX_Y = 10; // 0（奥）〜 10（自機位置）

let playerLane = 3;
let score = 0;
let hp = 3;
let currentWave = 1;
let isGameOver = false;

let enemies = [];
let enemyStepIndex = 0;
let lastStepTime = 0;
let stepInterval = 1800; // 最初は非常にゆっくり（約1.8秒に1歩）

let playerBullets = [];
let enemyBullets = [];

// Wave初期化（最初は1体から少しずつ増加）
function startWave(waveNum) {
  currentWave = waveNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];

  // Waveに応じた敵の数（Wave 1: 1体, Wave 2: 2体, Wave 3: 3体... 最大7体）
  const enemyCount = Math.min(LANES, waveNum);

  // レーンの選定（Wave 1は中央レーン3からスタート）
  let availableLanes = [0, 1, 2, 3, 4, 5, 6];
  let spawnLanes = [];

  if (enemyCount === 1) {
    spawnLanes = [3]; // 最初はど真ん中
  } else if (enemyCount === 2) {
    spawnLanes = [1, 5]; // 左右に1体ずつ
  } else if (enemyCount === 3) {
    spawnLanes = [1, 3, 5];
  } else {
    // ランダムまたは均等配置
    spawnLanes = [0, 1, 2, 3, 4, 5, 6].slice(0, enemyCount);
  }

  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      lane: spawnLanes[i],
      y: 1, // 最上段
      alive: true
    });
  }

  // Waveが進むにつれて少しずつ速度を上げるが、初期は十分にゆっくり
  // Wave 1: 1800ms, Wave 2: 1600ms, Wave 3: 1400ms...
  stepInterval = Math.max(600, 1800 - (waveNum - 1) * 150);
  enemyDir = 1;
  enemyStepIndex = 0;
  updateUI();
}

// 敵の移動処理（ゆっくり横移動し、端に当たると一段接近）
let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  // 端への接触判定
  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    // 一段ゆっくり迫る
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  // 生存している敵から音を鳴らす
  const soundEnemy = aliveEnemies[enemyStepIndex % aliveEnemies.length];
  enemyStepIndex++;

  const distRate = soundEnemy.y / MAX_Y;
  SFX.invaderStep(soundEnemy.lane, distRate, enemyStepIndex);

  // 敵の弾発射判定（Wave 1では撃たない、Wave 2以降で低頻度）
  if (currentWave >= 2 && Math.random() < 0.25) {
    enemyBullets.push({
      lane: soundEnemy.lane,
      y: soundEnemy.y
    });
  }
}

// 自機アクション
function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(playerLane);
  } else {
    SFX.wallBump(playerLane);
  }
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(playerLane);
  } else {
    SFX.wallBump(playerLane);
  }
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot(playerLane);
}

// リスタート処理
function restartGame() {
  score = 0;
  hp = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startWave(1);
}

function endGame() {
  isGameOver = true;
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentWave;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('wave-val').textContent = currentWave;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;
}

// --- メインループ ---
let lastTime = 0;
let bulletWarningTimer = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  // 敵の歩進
  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.22; // 上昇

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentWave;
        SFX.enemyExplode(e.lane);
        updateUI();

        // Waveクリア判定
        const remaining = enemies.filter(enemy => enemy.alive).length;
        if (remaining === 0) {
          SFX.waveClear();
          setTimeout(() => {
            startWave(currentWave + 1);
          }, 1000);
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // 敵弾移動（従来よりゆっくり避ける猶予を持たせる）
  bulletWarningTimer += dt;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += 0.035; // ゆったり接近

    // 直撃判定
    if (eb.y >= MAX_Y - 0.3 && eb.y <= MAX_Y + 0.3) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      }
    }

    if (eb.y > MAX_Y + 0.5) {
      enemyBullets.splice(i, 1);
    }
  }

  // 接近弾の警告音
  if (enemyBullets.length > 0 && bulletWarningTimer > 280) {
    bulletWarningTimer = 0;
    const closestBullet = [...enemyBullets].sort((a, b) => b.y - a.y)[0];
    if (closestBullet) {
      const distRate = closestBullet.y / MAX_Y;
      SFX.bulletApproaching(closestBullet.lane, distRate);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 1);

  // 7レーン描画
  for (let i = 0; i < LANES; i++) {
    ctx.strokeStyle = (i === playerLane) ? 'rgba(102, 252, 241, 0.3)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    ctx.fillStyle = (i === playerLane) ? '#66fcf1' : 'rgba(255, 255, 255, 0.25)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    const panText = i < 3 ? `L${3-i}` : (i === 3 ? 'C' : `R${i-3}`);
    ctx.fillText(panText, i * laneW + laneW / 2, 20);
  }

  // 敵
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;

    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.arc(x, y, laneW * 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  // プレイヤー弾
  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 3, y - 8, 6, 16);
  }

  // 敵弾
  ctx.fillStyle = '#ffcc00';
  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // プレイヤー自機
  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startWave(1);
});

// リスタートボタン
document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

// 目隠し切替
const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

// パン倍率切り替えボタン（1x, 2x, 5x, 10x）
const panBtns = document.querySelectorAll('.pan-btn');
panBtns.forEach(btn => {
  btn.addEventListener('click', (e) => {
    panBtns.forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    panMultiplier = parseFloat(e.target.dataset.multiplier);
    // 切り替え確認音をテスト再生（左端と右端で鳴らす）
    initAudio();
    playTone({ freq: 800, type: 'triangle', duration: 0.1, pan: getPan(1), gain: 0.2 });
    setTimeout(() => {
      playTone({ freq: 800, type: 'triangle', duration: 0.1, pan: getPan(5), gain: 0.2 });
    }, 120);
  });
});

// スマホ操作ボタンバインド
function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

// PCキーボード操作
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

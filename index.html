<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Audio Invaders (Active Radar)</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #08090c;
    color: #66fcf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ヘッダーエリア */
  header {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #151a21;
    font-size: 13px;
    z-index: 10;
    border-bottom: 1px solid #45a29e;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-box {
    font-weight: bold;
    font-size: 15px;
    color: #66fcf1;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .hdr-btn {
    background: #45a29e;
    color: #08090c;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }
  .hdr-btn.restart {
    background: #ffcc00;
  }

  /* ステータスバー */
  .radar-status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d1017;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: #c5c6c7;
  }
  .lockon-indicator {
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .lockon-indicator.locked {
    background: #ff0055;
    color: #fff;
    animation: blink 0.5s infinite alternate;
  }
  .lockon-indicator.searching {
    background: #1f2833;
    color: #66fcf1;
  }
  @keyframes blink {
    from { opacity: 0.7; }
    to { opacity: 1.0; }
  }

  /* ゲームメイン画面（レーダー表示） */
  #game-view {
    flex: 1;
    position: relative;
    background: #08090c;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  canvas {
    background: #0e1219;
    box-shadow: 0 0 25px rgba(102, 252, 241, 0.12);
  }

  /* 目隠しプレイ画面 */
  #blind-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #45a29e;
    z-index: 5;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  #blind-overlay.active {
    display: flex;
  }
  #blind-overlay h2 {
    font-size: 24px;
    margin-bottom: 12px;
    color: #66fcf1;
  }
  #blind-overlay p {
    font-size: 15px;
    line-height: 1.8;
    color: #c5c6c7;
  }

  /* 操作ボタンエリア */
  #controls {
    display: flex;
    height: 120px;
    background: #151a21;
    padding: 8px;
    gap: 8px;
    z-index: 10;
    border-top: 2px solid #45a29e;
  }
  .ctrl-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.05s, background-color 0.1s;
  }
  .ctrl-btn:active {
    transform: scale(0.96);
  }
  .ctrl-btn small {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 4px;
    font-weight: normal;
  }
  .btn-move {
    background: #222e3c;
    color: #66fcf1;
  }
  .btn-move:active {
    background: #2e3e52;
  }
  .btn-shot {
    background: #ff0055;
    color: #fff;
    flex: 1.2;
    box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
  }
  .btn-shot:active {
    background: #e6004c;
  }

  /* モーダル */
  .modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 9, 12, 0.95);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  .action-btn {
    margin-top: 20px;
    background: #66fcf1;
    color: #08090c;
    border: none;
    padding: 14px 32px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
  }
  .action-btn.danger {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
  }
</style>

<body>

  <header>
    <div class="header-top">
      <div class="score-box">WAVE <span id="wave-val">1</span> | HP <span id="hp-val">3</span> | SCORE <span id="score-val">0</span></div>

      <span>自機位置: レーン <span id="player-lane-txt">3 (中央)</span></span>

    </div>
  </header>

  <div id="game-view">
    <canvas id="radarCanvas"></canvas>

    <!-- 目隠しプレイ用オーバーレイ -->
    <div id="blind-overlay">
      <h2>🎧 ブラインドプレイ中</h2>
      <p>
        <b>常時発音ソナー搭載</b><br>
        敵がそれぞれ固有の音階を鳴らし続けています。<br>
        音が<b>【正面（真ん中）】</b>に合った瞬間に撃て！<br><br>
        正面から迫る敵弾の音が聞こえたらすぐ回避！
      </p>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="modal-overlay">
      <h1 style="color:#66fcf1; margin-bottom: 12px;">AUDIO INVADERS</h1>
      <p style="line-height: 1.8; color:#c5c6c7; font-size: 15px;">
        ⚠️ <b>イヤホン・ヘッドホン必須</b><br>
        <b>常時音を放つ敵を捉えるソナーシューティング</b><br><br>
        ・敵はそれぞれ異なる高さの音を鳴らし続けます<br>
        ・音が <b>【正面（真ん中）】</b> に来たら <b>撃つ！</b><br>
        ・敵が迫るほど音が大きくシャープになります
      </p>
      <button id="start-btn" class="action-btn">🎧 タップしてスタート</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="modal-overlay" style="display: none;">
      <h1 style="color:#ff0055; margin-bottom: 12px;">GAME OVER</h1>
      <p style="font-size: 18px; color:#fff; margin-bottom: 8px;">最終WAVE: <span id="final-wave">1</span></p>
      <p style="font-size: 16px; color:#c5c6c7;">スコア: <span id="final-score">0</span></p>
      <button id="restart-modal-btn" class="action-btn danger">🔄 もう一度遊ぶ</button>
    </div>
  </div>

  <!-- 下部操作ボタン -->
  <div id="controls">
    <button id="btn-left" class="ctrl-btn btn-move">
      ◀ 左移動
      <small>LEFT</small>
    </button>
    <button id="btn-fire" class="ctrl-btn btn-shot">
      🔥 撃つ
      <small>SHOT (正面)</small>
    </button>
    <button id="btn-right" class="ctrl-btn btn-move">
      右移動 ▶
      <small>RIGHT</small>
    </button>
  </div>

<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

/**
 * 敵ごとに区別しやすい音階周波数リスト（ペンタトニックスケール風）
 * 複数同時に鳴っても濁らず、耳の中で「あそこに高い敵、ここに低い敵」と明確に分離して聴き取れる
 */
const ENEMY_FREQS = [220, 277, 330, 415, 494, 554, 660]; // A3, C#4, E4, G#4, B4, C#5, E5

/**
 * 各敵の常時発音シンセサイザーノードを生成
 * リバーブなしのドライな超ワイドバイノーラル音響
 */
function createEnemySoundNodes(enemy, index) {
  if (!audioCtx) return null;
  const now = audioCtx.currentTime;

  // メインオシレーター（三角波/矩形波ブレンドで輪郭のはっきりした音）
  const osc = audioCtx.createOscillator();
  osc.type = index % 2 === 0 ? 'triangle' : 'sawtooth';
  const baseFreq = ENEMY_FREQS[index % ENEMY_FREQS.length];
  osc.frequency.setValueAtTime(baseFreq, now);

  // トレモロ（パルス感）を与えるためのLFO
  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.setValueAtTime(4.5 + (index * 0.8), now); // 敵ごとに少し異なるパルス周期
  lfoGain.gain.setValueAtTime(0.35, now);

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(0.5, now);
  lfo.connect(lfoGain);
  lfoGain.connect(vca.gain);

  // フィルター（距離によって開閉）
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(300, now);

  // バイノーラル定位用ノード群
  const merger = audioCtx.createChannelMerger(2);
  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  const leftDelay = audioCtx.createDelay(0.01);
  const rightDelay = audioCtx.createDelay(0.01);

  // 反対耳の頭部シャドウフィルター
  const shadowFilterL = audioCtx.createBiquadFilter();
  shadowFilterL.type = 'lowpass';
  shadowFilterL.frequency.setValueAtTime(650, now);

  const shadowFilterR = audioCtx.createBiquadFilter();
  shadowFilterR.type = 'lowpass';
  shadowFilterR.frequency.setValueAtTime(650, now);

  // 接続
  osc.connect(filter);
  filter.connect(vca);

  // Lルート
  vca.connect(leftGain);
  leftGain.connect(merger, 0, 0);

  // Rルート
  vca.connect(rightGain);
  rightGain.connect(merger, 0, 1);

  merger.connect(audioCtx.destination);

  osc.start(now);
  lfo.start(now);

  return {
    osc, lfo, vca, filter,
    leftGain, rightGain, leftDelay, rightDelay,
    merger,
    baseFreq,
    cleanup() {
      try {
        const stopTime = audioCtx.currentTime + 0.05;
        vca.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
        osc.stop(stopTime);
        lfo.stop(stopTime);
      } catch (err) {}
    }
  };
}

/**
 * 自機の位置と敵の位置・距離に応じて、敵の音をリアルタイム更新
 */
function updateEnemySpatialAudio(enemy) {
  if (!enemy.soundNodes || !audioCtx) return;
  const now = audioCtx.currentTime;
  const nodes = enemy.soundNodes;

  const diff = enemy.lane - playerLane; // 自機からの相対列差
  const distRate = enemy.y / MAX_Y; // 0.1(遠い) 〜 1.0(目前)

  // 距離に応じた音量（奥は小さく、手前はしっかり大きく）
  const masterVolume = Math.max(0.02, Math.pow(distRate, 1.6) * 0.28);

  // 距離に応じたフィルター周波数
  const filterCutoff = 250 + (distRate * 3500);
  nodes.filter.frequency.setTargetAtTime(filterCutoff, now, 0.03);

  if (diff === 0) {
    // 【正面・ロックオン】
    // 両耳均等、完全なセンター定位！高音がさらにクリアに抜ける
    nodes.leftGain.gain.setTargetAtTime(masterVolume * 1.25, now, 0.03);
    nodes.rightGain.gain.setTargetAtTime(masterVolume * 1.25, now, 0.03);
    nodes.osc.frequency.setTargetAtTime(nodes.baseFreq * 1.15, now, 0.03); // 正面で少し音が高くなって合致を強調
  } else {
    // 【左右にいる状態】
    nodes.osc.frequency.setTargetAtTime(nodes.baseFreq, now, 0.03);

    const sign = Math.sign(diff); // -1: 左, +1: 右
    const absDiff = Math.abs(diff);

    // 1列ズレただけでもガッツリ外側へ広げる超ワイドセパレーション
    const farEarVol = Math.max(0.005, 0.06 - (absDiff * 0.015));

    if (sign < 0) {
      // 敵は左側
      nodes.leftGain.gain.setTargetAtTime(masterVolume, now, 0.03);
      nodes.rightGain.gain.setTargetAtTime(masterVolume * farEarVol, now, 0.03);
    } else {
      // 敵は右側
      nodes.rightGain.gain.setTargetAtTime(masterVolume, now, 0.03);
      nodes.leftGain.gain.setTargetAtTime(masterVolume * farEarVol, now, 0.03);
    }
  }
}

// 効果音集
const SFX = {
  // 自機移動音：微細なソフトクリック（耳障りでない超控えめ音量）
  playerMove(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.02);

    panner.pan.setValueAtTime(dir < 0 ? -0.3 : 0.3, now);

    g.gain.setValueAtTime(0.03, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.02);
  },

  // 壁限界音
  wallBump(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    panner.pan.setValueAtTime(dir < 0 ? -0.8 : 0.8, now);

    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.04);
  },

  // ★ 自機ショット音：強すぎる低音を削り、シャープで鋭い短時間レーザー（ピシュッ！）
  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const highpass = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    // 高域寄りの鋭いピッチ下降（2200Hz -> 600Hz）
    osc.frequency.setValueAtTime(2200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);

    // 不要な低音をカットしてシャープにするハイパスフィルター
    highpass.type = 'highpass';
    highpass.frequency.setValueAtTime(700, now);

    // 音量は控えめでキレよく
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(highpass);
    highpass.connect(g);
    g.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  },

  // 迫る敵弾の音
  bulletApproaching(lane, distRate) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    const diff = lane - playerLane;
    const pan = diff === 0 ? 0 : Math.sign(diff) * Math.min(1.0, 0.5 + Math.abs(diff) * 0.3);
    panner.pan.setValueAtTime(pan, now);

    osc.type = 'sine';
    const startFreq = 500 + (distRate * 250);
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(50, startFreq - 220), now + 0.08);

    const gain = 0.04 + (distRate * 0.22);
    g.gain.setValueAtTime(gain, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

    osc.connect(panner);
    panner.connect(g);
    g.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.08);
  },

  // 敵撃破（ドライでキレのある爆発音）
  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(600, now);
    filter.Q.setValueAtTime(1.5, now);

    const panner = audioCtx.createStereoPanner();
    const diff = lane - playerLane;
    const pan = diff === 0 ? 0 : Math.sign(diff) * Math.min(1.0, 0.5 + Math.abs(diff) * 0.3);
    panner.pan.setValueAtTime(pan, now);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    noise.connect(filter);
    filter.connect(panner);
    panner.connect(g);
    g.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.2);
  },

  // ウェーブクリア
  waveClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }, idx * 90);
    });
  },

  // 被弾
  playerHit() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  // ゲームオーバー
  gameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.7);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }
};

// --- ゲームロジック ---
const LANES = 7;
const MAX_Y = 10;

let playerLane = 3;
let score = 0;
let hp = 3;
let currentWave = 1;
let isGameOver = false;

let enemies = [];
let lastStepTime = 0;
let stepInterval = 1700;

let playerBullets = [];
let enemyBullets = [];

// 全敵のオーディオノードを安全に停止・クリーンアップ
function clearAllEnemyAudio() {
  for (const e of enemies) {
    if (e.soundNodes) {
      e.soundNodes.cleanup();
      e.soundNodes = null;
    }
  }
}

function startWave(waveNum) {
  clearAllEnemyAudio();
  currentWave = waveNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];

  const enemyCount = Math.min(LANES, waveNum);
  let spawnLanes = [];

  if (enemyCount === 1) {
    spawnLanes = [1]; // 最初の1体は自機(3)から離れた左1列に出現
  } else if (enemyCount === 2) {
    spawnLanes = [1, 5]; // 左右に1体ずつ
  } else if (enemyCount === 3) {
    spawnLanes = [0, 3, 6];
  } else {
    spawnLanes = [0, 1, 2, 3, 4, 5, 6].slice(0, enemyCount);
  }

  for (let i = 0; i < enemyCount; i++) {
    const enemyObj = {
      lane: spawnLanes[i],
      y: 1,
      alive: true,
      soundNodes: null
    };
    // 常時発音ノードの生成
    enemyObj.soundNodes = createEnemySoundNodes(enemyObj, i);
    enemies.push(enemyObj);
  }

  stepInterval = Math.max(700, 1700 - (waveNum - 1) * 140);
  enemyDir = 1;
  updateUI();
  updateAllEnemiesAudio();
}

// 全敵の立体音響パラメータを一括更新
function updateAllEnemiesAudio() {
  for (const e of enemies) {
    if (e.alive) {
      updateEnemySpatialAudio(e);
    }
  }
}

let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  updateAllEnemiesAudio();

  // 敵の弾発射
  if (currentWave >= 2 && Math.random() < 0.22) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    enemyBullets.push({
      lane: shooter.lane,
      y: shooter.y
    });
  }
}

function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
    updateAllEnemiesAudio();
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
    updateAllEnemiesAudio();
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

function restartGame() {
  clearAllEnemyAudio();
  score = 0;
  hp = 3;
  playerLane = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startWave(1);
}

function endGame() {
  isGameOver = true;
  clearAllEnemyAudio();
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentWave;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('wave-val').textContent = currentWave;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneNames = ["0 (最左)", "1 (左中)", "2 (左微)", "3 (中央)", "4 (右微)", "5 (右中)", "6 (最右)"];
  document.getElementById('player-lane-txt').textContent = laneNames[playerLane] || playerLane;

  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に捕捉！今すぐ撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音の方向へ移動して捕捉";
  }
}

// --- メインループ ---
let lastTime = 0;
let bulletWarningTimer = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.26;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        if (e.soundNodes) {
          e.soundNodes.cleanup();
          e.soundNodes = null;
        }
        hit = true;
        score += 100 * currentWave;
        SFX.enemyExplode(e.lane);
        updateUI();

        const remaining = enemies.filter(enemy => enemy.alive).length;
        if (remaining === 0) {
          SFX.waveClear();
          setTimeout(() => {
            startWave(currentWave + 1);
          }, 900);
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // 敵弾移動
  bulletWarningTimer += dt;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += 0.035;

    if (eb.y >= MAX_Y - 0.3 && eb.y <= MAX_Y + 0.3) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      }
    }

    if (eb.y > MAX_Y + 0.5) {
      enemyBullets.splice(i, 1);
    }
  }

  if (enemyBullets.length > 0 && bulletWarningTimer > 300) {
    bulletWarningTimer = 0;
    const closestBullet = [...enemyBullets].sort((a, b) => b.y - a.y)[0];
    if (closestBullet) {
      const distRate = closestBullet.y / MAX_Y;
      SFX.bulletApproaching(closestBullet.lane, distRate);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 1);

  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.45)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `左${Math.abs(relDiff)}`;
    else relText = `右${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 11px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 20);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.4 : laneW * 0.32, 0, Math.PI * 2);
    ctx.fill();

    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 2, y - 8, 4, 16);
  }

  ctx.fillStyle = '#ffcc00';
  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startWave(1);
});

document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

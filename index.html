<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Audio Invaders (Relative Soundstage)</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body {
    background-color: #0b0c10;
    color: #66fcf1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ヘッダーエリア */
  header {
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #1f2833;
    font-size: 13px;
    z-index: 10;
    border-bottom: 1px solid #45a29e;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-box {
    font-weight: bold;
    font-size: 15px;
    color: #66fcf1;
  }
  .header-btns {
    display: flex;
    gap: 6px;
  }
  .hdr-btn {
    background: #45a29e;
    color: #0b0c10;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
  }
  .hdr-btn.restart {
    background: #ffcc00;
  }

  /* 相対ステータス案内バー */
  .radar-status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #11141a;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: #c5c6c7;
  }
  .lockon-indicator {
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .lockon-indicator.locked {
    background: #ff0055;
    color: #fff;
    animation: blink 0.5s infinite alternate;
  }
  .lockon-indicator.searching {
    background: #2a3b4c;
    color: #66fcf1;
  }
  @keyframes blink {
    from { opacity: 0.7; }
    to { opacity: 1.0; }
  }

  /* ゲームメイン画面（レーダー表示） */
  #game-view {
    flex: 1;
    position: relative;
    background: #0b0c10;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  canvas {
    background: #11141a;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.15);
  }

  /* 目隠し（ブラインド）オーバーレイ */
  #blind-overlay {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #45a29e;
    z-index: 5;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
  }
  #blind-overlay.active {
    display: flex;
  }
  #blind-overlay h2 {
    font-size: 24px;
    margin-bottom: 12px;
    color: #66fcf1;
  }
  #blind-overlay p {
    font-size: 15px;
    line-height: 1.8;
    color: #c5c6c7;
  }

  /* スマホ操作ボタンエリア */
  #controls {
    display: flex;
    height: 120px;
    background: #1f2833;
    padding: 8px;
    gap: 8px;
    z-index: 10;
    border-top: 2px solid #45a29e;
  }
  .ctrl-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.05s, background-color 0.1s;
  }
  .ctrl-btn:active {
    transform: scale(0.96);
  }
  .ctrl-btn small {
    font-size: 11px;
    opacity: 0.8;
    margin-top: 4px;
    font-weight: normal;
  }
  .btn-move {
    background: #2a3b4c;
    color: #66fcf1;
  }
  .btn-move:active {
    background: #3b526b;
  }
  .btn-shot {
    background: #ff0055;
    color: #fff;
    flex: 1.2;
    box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
  }
  .btn-shot:active {
    background: #e6004c;
  }

  /* モーダル */
  .modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 12, 16, 0.94);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  .action-btn {
    margin-top: 20px;
    background: #66fcf1;
    color: #0b0c10;
    border: none;
    padding: 14px 32px;
    font-size: 19px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
  }
  .action-btn.danger {
    background: #ff0055;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
  }
</style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="score-box">WAVE <span id="wave-val">1</span> | HP <span id="hp-val">3</span> | SCORE <span id="score-val">0</span></div>
      <div class="header-btns">
        <button id="restart-header-btn" class="hdr-btn restart">🔄 最初から</button>
        <button id="toggle-visual-btn" class="hdr-btn">👁️ 目隠し</button>
      </div>
    </div>
    <div class="radar-status-bar">
      <span>自機位置: レーン <span id="player-lane-txt">3 (中央)</span></span>
      <span id="lockon-badge" class="lockon-indicator searching">探索中...</span>
    </div>
  </header>

  <div id="game-view">
    <canvas id="radarCanvas"></canvas>

    <!-- 目隠しプレイ用オーバーレイ -->
    <div id="blind-overlay">
      <h2>🎧 ブラインドプレイ中</h2>
      <p>
        <b>音が聞こえる方向へ移動！</b><br>
        音が<b>【正面（両耳の中央）】</b>に<br>
        揃った瞬間が撃つチャンスです！<br><br>
        敵が迫るほど音が大きくなります。<br>
        敵弾の音が正面から迫ったらすぐ横へ回避！
      </p>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="modal-overlay">
      <h1 style="color:#66fcf1; margin-bottom: 12px;">AUDIO INVADERS</h1>
      <p style="line-height: 1.8; color:#c5c6c7; font-size: 15px;">
        ⚠️ <b>イヤホン・ヘッドホン必須</b><br>
        <b>自機を中心とした「相対音場」システム</b><br><br>
        ・左から音がしたら <b>左へ移動</b><br>
        ・音が <b>【正面】</b> に合致したら <b>撃つ！</b><br>
        ・敵が近づくほど音が大きく迫力UP！
      </p>
      <button id="start-btn" class="action-btn">🎧 タップしてスタート</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="modal-overlay" style="display: none;">
      <h1 style="color:#ff0055; margin-bottom: 12px;">GAME OVER</h1>
      <p style="font-size: 18px; color:#fff; margin-bottom: 8px;">最終WAVE: <span id="final-wave">1</span></p>
      <p style="font-size: 16px; color:#c5c6c7;">スコア: <span id="final-score">0</span></p>
      <button id="restart-modal-btn" class="action-btn danger">🔄 もう一度遊ぶ</button>
    </div>
  </div>

  <!-- 下部特大操作ボタン -->
  <div id="controls">
    <button id="btn-left" class="ctrl-btn btn-move">
      ◀ 左移動
      <small>LEFT</small>
    </button>
    <button id="btn-fire" class="ctrl-btn btn-shot">
      🔥 撃つ
      <small>SHOT (正面)</small>
    </button>
    <button id="btn-right" class="ctrl-btn btn-move">
      右移動 ▶
      <small>RIGHT</small>
    </button>
  </div>

<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// ★ 相対音場パン計算 ★
// 自機位置（playerLane）を「0.0（正面）」とし、
// 敵が自分より左にいればマイナス（左）、右にいればプラス（右）へ聞こえる。
// 自機を動かして敵と同じレーンに入ると diff === 0 となり、完全な正面（真ん中）で聞こえる！
function getRelativePan(targetLane) {
  const diff = targetLane - playerLane; // -6 〜 +6
  if (diff === 0) return 0.0; // 完全な正面！

  // 1列ズレるごとに大きく左右へ振る（1列差で約0.45、2列差で0.8、3列以上で1.0全振り）
  const sign = Math.sign(diff);
  const absDiff = Math.abs(diff);
  const panVal = Math.min(1.0, 0.45 + (absDiff - 1) * 0.35);
  return sign * panVal;
}

// 汎用サウンド再生
function playTone({ freq, type = 'square', duration = 0.08, pan = 0, gain = 0.2, pitchDecay = 0, filterFreq = null }) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (pitchDecay !== 0) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + pitchDecay), now + duration);
  }

  panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), now);

  gainNode.gain.setValueAtTime(gain, now);
  gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

  let lastNode = osc;
  if (filterFreq) {
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterFreq, now);
    lastNode.connect(filter);
    lastNode = filter;
  }

  lastNode.connect(panner);
  panner.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + duration);
}

// 効果音集
const SFX = {
  // 自機移動音（左に動いたときは左寄り、右に動いたときは右寄りで短くシュッ）
  playerMove(dir) {
    const pan = dir < 0 ? -0.4 : 0.4;
    playTone({ freq: 880, type: 'triangle', duration: 0.04, pan: pan, gain: 0.2 });
  },
  // 壁限界音（端でそれ以上進めない）
  wallBump(dir) {
    const pan = dir < 0 ? -1.0 : 1.0;
    playTone({ freq: 140, type: 'sawtooth', duration: 0.09, pan: pan, gain: 0.35 });
  },
  // プレイヤーショット（正面から前方へ突き抜ける発射音）
  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.12);

    gainNode.gain.setValueAtTime(0.25, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination); // 正面（pan=0）

    osc.start(now);
    osc.stop(now + 0.12);
  },
  // 敵の断続音（ソナー/ビーコン）
  // 遠くでは小さく低く、近づくにつれて音量がグッと大きくクリアになる！
  invaderPulse(lane, distRate, isLockedOn) {
    const pan = getRelativePan(lane);

    // 距離（distRate: 0.1=遠い 〜 1.0=至近）に応じた音量カーブ（2乗で遠くは小さく、近づくと大音量）
    const gain = Math.max(0.03, Math.pow(distRate, 1.8) * 0.42);

    // 遠いとこもり、近いとクリアな倍音
    const filterFreq = 220 + (distRate * 2800);

    // 正面（ロックオン状態）の時は高い音で「ピッ！」とピタリ合致した実感を与える
    if (isLockedOn) {
      // ロックオン時：高めで歯切れの良い二重ビーコン
      playTone({
        freq: 600 + (distRate * 120),
        type: 'square',
        duration: 0.07,
        pan: 0,
        gain: gain * 1.2,
        filterFreq: filterFreq + 500
      });
    } else {
      // 左右にいる時：低めの断続音「トッ…」
      playTone({
        freq: 220 + (distRate * 80),
        type: 'triangle',
        duration: 0.06,
        pan: pan,
        gain: gain,
        filterFreq: filterFreq
      });
    }
  },
  // 迫る敵弾の音（自機からの相対位置で聞こえる）
  bulletApproaching(lane, distRate) {
    const pan = getRelativePan(lane);
    const gain = 0.05 + (distRate * 0.28);
    playTone({
      freq: 480 + (distRate * 300),
      pitchDecay: -180,
      type: 'sine',
      duration: 0.1,
      pan: pan,
      gain: gain
    });
  },
  // 敵撃破（正面または敵の相対位置で爆発）
  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.28;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(900, now);
    filter.frequency.linearRampToValueAtTime(100, now + 0.28);

    const panner = audioCtx.createStereoPanner();
    panner.pan.setValueAtTime(getRelativePan(lane), now);

    const gainNode = audioCtx.createGain();
    gainNode.gain.setValueAtTime(0.45, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.28);

    noise.connect(filter);
    filter.connect(panner);
    panner.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.28);
  },
  // ウェーブクリアファンファーレ
  waveClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        playTone({ freq: f, type: 'triangle', duration: 0.18, pan: 0, gain: 0.25 });
      }, idx * 100);
    });
  },
  // プレイヤー被弾
  playerHit() {
    playTone({ freq: 85, pitchDecay: -45, type: 'sawtooth', duration: 0.4, pan: 0, gain: 0.5 });
  },
  // ゲームオーバー
  gameOver() {
    playTone({ freq: 200, pitchDecay: -110, type: 'sawtooth', duration: 0.8, pan: 0, gain: 0.45 });
  }
};

// --- ゲームロジック ---
const LANES = 7; // 0 〜 6
const MAX_Y = 10; // 0（奥）〜 10（自機位置）

let playerLane = 3; // 初期位置: 中央3
let score = 0;
let hp = 3;
let currentWave = 1;
let isGameOver = false;

let enemies = [];
let enemyStepIndex = 0;
let lastStepTime = 0;
let stepInterval = 1700; // ゆっくり（約1.7秒に1歩）

// 敵の断続パルス音タイマー（歩進とは別に、定期的に断続音「ピッ…ピッ…」と発音）
let lastPulseTime = 0;
const PULSE_INTERVAL = 700; // 0.7秒おきに断続的に鳴る

let playerBullets = [];
let enemyBullets = [];

// Wave初期化
function startWave(waveNum) {
  currentWave = waveNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];

  const enemyCount = Math.min(LANES, waveNum);
  let spawnLanes = [];

  if (enemyCount === 1) {
    // 最初の1体は、自機（3）から少し離れた列（例: 1列目か5列目）に配置
    // これにより「左から音がする！→左へ2回移動→正面になった！→撃つ！」という体験が即座にできる！
    spawnLanes = [1];
  } else if (enemyCount === 2) {
    spawnLanes = [1, 5];
  } else if (enemyCount === 3) {
    spawnLanes = [0, 3, 6];
  } else {
    spawnLanes = [0, 1, 2, 3, 4, 5, 6].slice(0, enemyCount);
  }

  for (let i = 0; i < enemyCount; i++) {
    enemies.push({
      lane: spawnLanes[i],
      y: 1, // 最上段（遠く）
      alive: true
    });
  }

  stepInterval = Math.max(700, 1700 - (waveNum - 1) * 140);
  enemyDir = 1;
  enemyStepIndex = 0;
  updateUI();
}

// 敵の移動処理（ゆっくり横移動し、端で一段接近）
let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  // 敵の弾発射判定（Wave 2以降で低頻度）
  if (currentWave >= 2 && Math.random() < 0.22) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    enemyBullets.push({
      lane: shooter.lane,
      y: shooter.y
    });
  }
}

// 自機操作
function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

// リスタート
function restartGame() {
  score = 0;
  hp = 3;
  playerLane = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startWave(1);
}

function endGame() {
  isGameOver = true;
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentWave;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('wave-val').textContent = currentWave;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneNames = ["0 (最左)", "1 (左中)", "2 (左微)", "3 (中央)", "4 (右微)", "5 (右中)", "6 (最右)"];
  document.getElementById('player-lane-txt').textContent = laneNames[playerLane] || playerLane;

  // 正面に敵がいるか（ロックオン判定）
  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に捕捉！今すぐ撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音の方向へ移動して捕捉";
  }
}

// --- メインループ ---
let lastTime = 0;
let bulletWarningTimer = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  // 敵の移動歩進
  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // ★ 敵の断続的な音（パルス）の定期再生 ★
  if (time - lastPulseTime > PULSE_INTERVAL) {
    lastPulseTime = time;
    const aliveEnemies = enemies.filter(e => e.alive);
    if (aliveEnemies.length > 0) {
      // 1体ずつ順番に、あるいは最も近い敵の音を断続的に発音
      const soundEnemy = aliveEnemies[enemyStepIndex % aliveEnemies.length];
      enemyStepIndex++;

      const distRate = soundEnemy.y / MAX_Y; // 0.1(遠い) 〜 1.0(目前)
      const isLockedOn = (soundEnemy.lane === playerLane);

      SFX.invaderPulse(soundEnemy.lane, distRate, isLockedOn);
    }
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.24;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentWave;
        SFX.enemyExplode(e.lane);
        updateUI();

        const remaining = enemies.filter(enemy => enemy.alive).length;
        if (remaining === 0) {
          SFX.waveClear();
          setTimeout(() => {
            startWave(currentWave + 1);
          }, 1000);
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // 敵弾移動
  bulletWarningTimer += dt;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += 0.035;

    // 直撃判定
    if (eb.y >= MAX_Y - 0.3 && eb.y <= MAX_Y + 0.3) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      }
    }

    if (eb.y > MAX_Y + 0.5) {
      enemyBullets.splice(i, 1);
    }
  }

  // 迫る敵弾の音（正面から聞こえたら直撃コース＝回避必須！）
  if (enemyBullets.length > 0 && bulletWarningTimer > 320) {
    bulletWarningTimer = 0;
    const closestBullet = [...enemyBullets].sort((a, b) => b.y - a.y)[0];
    if (closestBullet) {
      const distRate = closestBullet.y / MAX_Y;
      SFX.bulletApproaching(closestBullet.lane, distRate);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 1);

  // 7レーン描画
  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.4)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    // 相対表示（自機から見て何列離れているか）
    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `左${Math.abs(relDiff)}`;
    else relText = `右${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 11px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 20);
  }

  // 敵の描画
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.4 : laneW * 0.32, 0, Math.PI * 2);
    ctx.fill();

    // ロックオン照準リング
    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  // プレイヤー弾
  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 3, y - 8, 6, 16);
  }

  // 敵弾
  ctx.fillStyle = '#ffcc00';
  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // プレイヤー自機
  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startWave(1);
});

// リスタート
document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

// 目隠し切替
const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

// スマホ操作ボタンバインド
function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

// PCキーボード操作
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>

  <div id="game-view">

        ⚠️ <b>イヤホン・ヘッドホン必須</b><br><br>
        ・各フェーズの<b>【撃破ノルマ】</b>を達成してクリア！<br>
        ・敵の音階は完全ランダムに発生します<br>
        ・敵の攻撃は<b>重低音の連続音</b>。避ければ通過して消えます
      </p>

      <small>RIGHT</small>

<script>
// --- 音響エンジン（Web Audio API） ---
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// コード進行音階リスト（どの位置でもランダムに発生）
const ENEMY_FREQS = [220, 277, 330, 415, 494, 554, 660];

/**
 * ★ パンの値を従来の倍に設定 ★
 * 1列離れただけでもガッツリ外側へ振り、明確に左右を強調！
 */
function getDoublePanSpatialParams(targetLane) {
  const diff = targetLane - playerLane; // -6 〜 +6
  const absDiff = Math.abs(diff);
  const sign = Math.sign(diff); // -1: 左, 0: 正面, 1: 右

  if (diff === 0) {
    return {
      pan: 0.0,
      leftVol: 1.0,
      rightVol: 1.0,
      leftDelay: 0,
      rightDelay: 0,
      distanceAttenuation: 1.0
    };
  }

  // ★ パンの値をすべて従来の倍に設定 ★
  // 1列差: 0.56（従来の0.28から倍増、斜め〜横寄り）
  // 2列差: 0.95（ほぼ完全な横）
  // 3列差以上: 1.00（完全な端・外側）
  const panSteps = [0, 0.56, 0.95, 1.0, 1.0, 1.0, 1.0];
  const panVal = sign * (panSteps[absDiff] || 1.0);

  // 反対耳の音量（より急激にカットしてセパレーション倍増）
  const farEarSteps = [1.0, 0.35, 0.12, 0.03, 0.01, 0.01, 0.01];
  const farRatio = farEarSteps[absDiff] || 0.01;

  // ITDディレイ
  const delayTime = Math.min(0.00075, absDiff * 0.00015);

  // 横方向の距離減衰
  const distAttenuation = Math.max(0.4, 1.0 - (absDiff * 0.11));

  if (sign < 0) {
    return {
      pan: panVal,
      leftVol: 1.0 * distAttenuation,
      rightVol: farRatio * distAttenuation,
      leftDelay: 0,
      rightDelay: delayTime,
      distanceAttenuation: distAttenuation
    };
  } else {
    return {
      pan: panVal,
      rightVol: 1.0 * distAttenuation,
      leftVol: farRatio * distAttenuation,
      rightDelay: 0,
      leftDelay: delayTime,
      distanceAttenuation: distAttenuation
    };
  }
}

/**
 * 敵のステップ発音（倍加パン出力）
 */
function playSpatialTone({ freq, duration = 0.12, lane, distRate = 0.5, type = 'sine' }) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  const spatial = getDoublePanSpatialParams(lane);
  const baseGain = Math.max(0.04, Math.pow(distRate, 1.4) * 0.35) * spatial.distanceAttenuation;

  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc2Gain = audioCtx.createGain();

  osc1.type = type;
  osc1.frequency.setValueAtTime(freq, now);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, now);
  osc2Gain.gain.setValueAtTime(0.2, now);
  osc2.connect(osc2Gain);

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(baseGain, now);
  vca.gain.exponentialRampToValueAtTime(0.001, now + duration);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(900 + (distRate * 2500), now);

  osc1.connect(filter);
  osc2Gain.connect(filter);
  filter.connect(vca);

  const merger = audioCtx.createChannelMerger(2);
  const leftGain = audioCtx.createGain();
  const rightGain = audioCtx.createGain();
  const leftDelay = audioCtx.createDelay(0.01);
  const rightDelay = audioCtx.createDelay(0.01);

  leftGain.gain.setValueAtTime(spatial.leftVol, now);
  rightGain.gain.setValueAtTime(spatial.rightVol, now);
  leftDelay.delayTime.setValueAtTime(spatial.leftDelay, now);
  rightDelay.delayTime.setValueAtTime(spatial.rightDelay, now);

  vca.connect(leftDelay);
  leftDelay.connect(leftGain);
  leftGain.connect(merger, 0, 0); // L

  vca.connect(rightDelay);
  rightDelay.connect(rightGain);
  rightGain.connect(merger, 0, 1); // R

  merger.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);
  osc1.stop(now + duration);
  osc2.stop(now + duration);
}

/**
 * ★ 敵の攻撃弾：重低音エナジー連続音（低く唸る音） ★
 * 85Hz〜95Hz のサブベース音（不快感ゼロ、迫力ある重低音ドローン）
 */
function createEnemyBulletSound(bullet) {
  if (!audioCtx) return null;
  const now = audioCtx.currentTime;

  const osc1 = audioCtx.createOscillator();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(88, now); // 重低音88Hz

  const osc2 = audioCtx.createOscillator();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(92, now); // わずかに唸り（ビート）を加える

  const vca = audioCtx.createGain();
  vca.gain.setValueAtTime(0.03, now);

  // マイルドな低域フィルター
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(280, now);

  const panner = audioCtx.createStereoPanner();

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(panner);
  panner.connect(vca);
  vca.connect(audioCtx.destination);

  osc1.start(now);
  osc2.start(now);

  return {
    osc1, osc2, vca, panner, filter,
    isPassingBack: false,
    cleanup() {
      try {
        const stopTime = audioCtx.currentTime + 0.05;
        vca.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
        osc1.stop(stopTime);
        osc2.stop(stopTime);
      } catch (e) {}
    }
  };
}

// 効果音集
const SFX = {
  playerMove(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(250, now + 0.02);

    panner.pan.setValueAtTime(dir < 0 ? -0.4 : 0.4, now);

    g.gain.setValueAtTime(0.03, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.02);
  },

  wallBump(dir) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const panner = audioCtx.createStereoPanner();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(100, now);
    panner.pan.setValueAtTime(dir < 0 ? -0.9 : 0.9, now);

    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

    osc.connect(g);
    g.connect(panner);
    panner.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.04);
  },

  playerShot() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const highpass = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);

    highpass.type = 'highpass';
    highpass.frequency.setValueAtTime(700, now);

    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

    osc.connect(highpass);
    highpass.connect(g);
    g.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.05);
  },

  enemyExplode(lane) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(550, now);
    filter.Q.setValueAtTime(1.5, now);

    const panner = audioCtx.createStereoPanner();
    const spatial = getDoublePanSpatialParams(lane);
    panner.pan.setValueAtTime(spatial.pan, now);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

    noise.connect(filter);
    filter.connect(panner);
    panner.connect(g);
    g.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.2);
  },

  // フェーズクリア（ファンファーレ）
  phaseClear() {
    [523, 659, 784, 1046].forEach((f, idx) => {
      setTimeout(() => {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      }, idx * 90);
    });
  },

  playerHit() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    g.gain.setValueAtTime(0.4, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  },

  gameOver() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.7);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }
};

// --- ゲームロジック ---
const LANES = 7;
const MAX_Y = 10;

let playerLane = 3;
let score = 0;
let hp = 3;
let currentPhase = 1;
let quotaRemaining = 3; // 各フェーズの撃破ノルマ
let isGameOver = false;

let enemies = [];
let lastStepTime = 0;
let stepInterval = 2400; // フェーズごとに加速

let lastBeatTime = 0;
let currentEnemyBeatIndex = 0;

let playerBullets = [];
let enemyBullets = [];

function clearAllBulletsAudio() {
  for (const b of enemyBullets) {
    if (b.soundNodes) {
      b.soundNodes.cleanup();
      b.soundNodes = null;
    }
  }
}

// 敵を1体スポーン（ランダムな位置・ランダムな音階）
function spawnEnemy() {
  // すでに生きている敵のレーンと重ならないように選ぶ
  const occupiedLanes = enemies.filter(e => e.alive).map(e => e.lane);
  const freeLanes = [0, 1, 2, 3, 4, 5, 6].filter(l => !occupiedLanes.includes(l));
  const chosenLane = freeLanes.length > 0
    ? freeLanes[Math.floor(Math.random() * freeLanes.length)]
    : Math.floor(Math.random() * LANES);

  // ★ 音階は場所に関係なく、完全にランダム！ ★
  const randomFreq = ENEMY_FREQS[Math.floor(Math.random() * ENEMY_FREQS.length)];

  enemies.push({
    lane: chosenLane,
    y: 1,
    alive: true,
    freq: randomFreq
  });
}

// フェーズ初期化（ノルマ設定・速度・射撃数調整）
function startPhase(phaseNum) {
  clearAllBulletsAudio();
  currentPhase = phaseNum;
  enemies = [];
  playerBullets = [];
  enemyBullets = [];
  currentEnemyBeatIndex = 0;

  // ★ ノルマ設定: Phase 1は3体、Phase 2は5体、Phase 3は7体... ★
  quotaRemaining = 3 + (phaseNum - 1) * 2;

  // 画面内の最大同時敵数（Phase 1: 1体, Phase 2: 2体, Phase 3: 2体, Phase 4+: 3体）
  const maxOnScreen = Math.min(3, 1 + Math.floor((phaseNum - 1) / 1.5));

  for (let i = 0; i < maxOnScreen; i++) {
    spawnEnemy();
  }

  // ★ フェーズが進むと敵の進んでくる速度が上昇 ★
  // Phase 1: 2400ms, Phase 2: 2050ms, Phase 3: 1750ms, Phase 4: 1500ms...
  stepInterval = Math.max(900, 2400 - (phaseNum - 1) * 260);

  enemyDir = 1;
  updateUI();
}

let enemyDir = 1;
function stepEnemies() {
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0) return;

  let hitWall = false;
  for (const e of aliveEnemies) {
    if ((enemyDir === 1 && e.lane >= LANES - 1) || (enemyDir === -1 && e.lane <= 0)) {
      hitWall = true;
      break;
    }
  }

  if (hitWall) {
    enemyDir *= -1;
    for (const e of aliveEnemies) {
      e.y += 1;
      if (e.y >= MAX_Y) {
        hp = 0;
        endGame();
        return;
      }
    }
  } else {
    for (const e of aliveEnemies) {
      e.lane += enemyDir;
    }
  }

  // ★ 射撃数はフェーズに応じて緩やかに上昇 ★
  // Phase 1: 射撃なし(0%)
  // Phase 2: 12%
  // Phase 3: 18%
  // Phase 4: 24%... (最大35%)
  const shootChance = currentPhase === 1 ? 0 : Math.min(0.35, 0.08 + (currentPhase - 1) * 0.06);

  if (Math.random() < shootChance) {
    const shooter = aliveEnemies[Math.floor(Math.random() * aliveEnemies.length)];
    const bulletObj = {
      lane: shooter.lane,
      y: shooter.y,
      speed: 0.038,
      passed: false,
      soundNodes: null
    };
    bulletObj.soundNodes = createEnemyBulletSound(bulletObj);
    enemyBullets.push(bulletObj);
  }
}

function moveLeft() {
  if (isGameOver) return;
  initAudio();
  if (playerLane > 0) {
    playerLane--;
    SFX.playerMove(-1);
  } else {
    SFX.wallBump(-1);
  }
  updateUI();
}

function moveRight() {
  if (isGameOver) return;
  initAudio();
  if (playerLane < LANES - 1) {
    playerLane++;
    SFX.playerMove(1);
  } else {
    SFX.wallBump(1);
  }
  updateUI();
}

function fireShot() {
  if (isGameOver) return;
  initAudio();
  if (playerBullets.length >= 2) return;

  playerBullets.push({
    lane: playerLane,
    y: MAX_Y
  });
  SFX.playerShot();
}

function restartGame() {
  clearAllBulletsAudio();
  score = 0;
  hp = 3;
  playerLane = 3;
  isGameOver = false;
  document.getElementById('gameover-screen').style.display = 'none';
  startPhase(1);
}

function endGame() {
  isGameOver = true;
  clearAllBulletsAudio();
  SFX.gameOver();
  document.getElementById('final-wave').textContent = currentPhase;
  document.getElementById('final-score').textContent = score;
  document.getElementById('gameover-screen').style.display = 'flex';
  updateUI();
}

function updateUI() {
  document.getElementById('phase-val').textContent = currentPhase;
  document.getElementById('quota-val').textContent = quotaRemaining;
  document.getElementById('hp-val').textContent = hp;
  document.getElementById('score-val').textContent = score;

  const laneNames = ["0 (最左)", "1 (左中)", "2 (左微)", "3 (中央)", "4 (右微)", "5 (右中)", "6 (最右)"];
  document.getElementById('player-lane-txt').textContent = laneNames[playerLane] || playerLane;

  const locked = enemies.some(e => e.alive && e.lane === playerLane);
  const badge = document.getElementById('lockon-badge');
  if (locked) {
    badge.className = "lockon-indicator locked";
    badge.textContent = "🎯 正面に敵の音！撃て！";
  } else {
    badge.className = "lockon-indicator searching";
    badge.textContent = "音を正面に捉えて撃て";
  }
}

// --- メインループ ---
let lastTime = 0;

function gameLoop(time) {
  requestAnimationFrame(gameLoop);
  if (!lastTime) lastTime = time;
  const dt = time - lastTime;
  lastTime = time;

  if (isGameOver || !audioCtx) {
    drawRadar();
    return;
  }

  // 敵の歩進
  if (time - lastStepTime > stepInterval) {
    lastStepTime = time;
    stepEnemies();
  }

  // アルペジオ発音
  const aliveEnemies = enemies.filter(e => e.alive);
  if (aliveEnemies.length > 0) {
    const interval = aliveEnemies.length === 1 ? 550 : Math.max(260, 500 / aliveEnemies.length);

    if (time - lastBeatTime > interval) {
      lastBeatTime = time;
      const targetEnemy = aliveEnemies[currentEnemyBeatIndex % aliveEnemies.length];
      currentEnemyBeatIndex++;

      const distRate = targetEnemy.y / MAX_Y;
      playSpatialTone({
        freq: targetEnemy.freq,
        duration: 0.14,
        lane: targetEnemy.lane,
        distRate: distRate,
        type: 'sine'
      });
    }
  }

  // プレイヤー弾移動
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.y -= 0.26;

    let hit = false;
    for (const e of enemies) {
      if (e.alive && e.lane === b.lane && Math.abs(e.y - b.y) < 0.7) {
        e.alive = false;
        hit = true;
        score += 100 * currentPhase;
        quotaRemaining--;
        SFX.enemyExplode(e.lane);
        updateUI();

        // ★ ノルマ達成判定 ★
        if (quotaRemaining <= 0) {
          // フェーズクリア！
          SFX.phaseClear();
          clearAllBulletsAudio();
          setTimeout(() => {
            startPhase(currentPhase + 1);
          }, 1100);
          break;
        } else {
          // ノルマ未達：画面内の敵数が不足していれば、少し遅れて新敵を補充
          const maxOnScreen = Math.min(3, 1 + Math.floor((currentPhase - 1) / 1.5));
          const currentAlive = enemies.filter(enemy => enemy.alive).length;
          if (currentAlive < maxOnScreen) {
            setTimeout(() => {
              if (!isGameOver && quotaRemaining > 0) {
                spawnEnemy();
              }
            }, 800);
          }
        }
        break;
      }
    }

    if (hit || b.y < 0) {
      playerBullets.splice(i, 1);
    }
  }

  // ★ 敵弾移動 ＆ 重低音連続音・回避後方フェード ★
  const now = audioCtx.currentTime;
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.y += eb.speed;

    const spatial = getDoublePanSpatialParams(eb.lane);
    const distRate = eb.y / MAX_Y;

    if (eb.soundNodes) {
      const nodes = eb.soundNodes;

      if (!eb.passed) {
        // 自機の手前に迫る段階：倍加パンで迫る（重低音ドローン）
        nodes.panner.pan.setTargetAtTime(spatial.pan, now, 0.02);

        // 距離に応じた音量（奥は小さく、近づくと重低音が増大）
        const vol = 0.03 + (distRate * 0.24);
        nodes.vca.gain.setTargetAtTime(vol, now, 0.02);
      } else {
        // ★ 回避成功：ドップラーは無くし、背後へスーッと音量をフェードアウト ★
        if (!nodes.isPassingBack) {
          nodes.isPassingBack = true;
          nodes.vca.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        }
      }
    }

    // 自機ライン（MAX_Y）判定
    if (!eb.passed && eb.y >= MAX_Y - 0.2) {
      if (eb.lane === playerLane) {
        hp--;
        updateUI();
        SFX.playerHit();
        if (eb.soundNodes) eb.soundNodes.cleanup();
        enemyBullets.splice(i, 1);
        if (hp <= 0) {
          endGame();
        }
        continue;
      } else {
        eb.passed = true; // 回避成功
      }
    }

    // 背後へ抜け切った時点で消滅
    if (eb.y > MAX_Y + 1.8) {
      if (eb.soundNodes) eb.soundNodes.cleanup();
      enemyBullets.splice(i, 1);
    }
  }

  drawRadar();
}

// --- 視覚用レーダー描画 ---
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-view');
  const w = Math.min(container.clientWidth, 480);
  const h = container.clientHeight;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawRadar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const laneW = canvas.width / LANES;
  const unitH = canvas.height / (MAX_Y + 2);

  for (let i = 0; i < LANES; i++) {
    const isPlayer = (i === playerLane);
    ctx.strokeStyle = isPlayer ? 'rgba(102, 252, 241, 0.45)' : 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = isPlayer ? 2 : 1;
    ctx.strokeRect(i * laneW, 0, laneW, canvas.height);

    const relDiff = i - playerLane;
    let relText = "";
    if (relDiff === 0) relText = "正面";
    else if (relDiff < 0) relText = `左${Math.abs(relDiff)}`;
    else relText = `右${relDiff}`;

    ctx.fillStyle = isPlayer ? '#66fcf1' : 'rgba(255, 255, 255, 0.3)';
    ctx.font = isPlayer ? 'bold 11px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(relText, i * laneW + laneW / 2, 18);
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.lane * laneW + laneW / 2;
    const y = e.y * unitH;
    const isLocked = (e.lane === playerLane);

    ctx.fillStyle = isLocked ? '#ff0055' : '#ff5577';
    ctx.beginPath();
    ctx.arc(x, y, isLocked ? laneW * 0.4 : laneW * 0.32, 0, Math.PI * 2);
    ctx.fill();

    if (isLocked) {
      ctx.strokeStyle = '#ffff00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, laneW * 0.48, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 2, 2, 3);
    ctx.fillRect(x + 2, y - 2, 2, 3);
  }

  ctx.fillStyle = '#66fcf1';
  for (const b of playerBullets) {
    const x = b.lane * laneW + laneW / 2;
    const y = b.y * unitH;
    ctx.fillRect(x - 2, y - 8, 4, 16);
  }

  for (const eb of enemyBullets) {
    const x = eb.lane * laneW + laneW / 2;
    const y = eb.y * unitH;
    ctx.fillStyle = eb.passed ? 'rgba(255, 204, 0, 0.3)' : '#ffcc00';
    ctx.beginPath();
    ctx.arc(x, y, eb.passed ? 4 : 6, 0, Math.PI * 2);
    ctx.fill();
  }

  const px = playerLane * laneW + laneW / 2;
  const py = MAX_Y * unitH;
  ctx.fillStyle = isGameOver ? '#666' : '#45a29e';
  ctx.beginPath();
  ctx.moveTo(px, py - 14);
  ctx.lineTo(px - 14, py + 12);
  ctx.lineTo(px + 14, py + 12);
  ctx.closePath();
  ctx.fill();
}

// --- イベント登録 ---
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  startPhase(1);
});

document.getElementById('restart-header-btn').addEventListener('click', restartGame);
document.getElementById('restart-modal-btn').addEventListener('click', restartGame);

const blindOverlay = document.getElementById('blind-overlay');
document.getElementById('toggle-visual-btn').addEventListener('click', () => {
  blindOverlay.classList.toggle('active');
});

function bindButton(id, action) {
  const btn = document.getElementById(id);
  const handleAction = (e) => {
    e.preventDefault();
    action();
  };
  btn.addEventListener('touchstart', handleAction, { passive: false });
  btn.addEventListener('mousedown', handleAction);
}

bindButton('btn-left', moveLeft);
bindButton('btn-right', moveRight);
bindButton('btn-fire', fireShot);

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
  if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
  if (e.code === 'Space' || e.code === 'Enter') fireShot();
});

requestAnimationFrame(gameLoop);
</script>
